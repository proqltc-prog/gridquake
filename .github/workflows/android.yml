name: Android app

# Builds the Android app ONLY when started by hand (Actions > Android app >
# Run workflow), after the owner has approved a test APK. The result
# is a debug APK that can be installed directly on an Android phone for
# testing: open the run in the Actions tab and download "gridquake-apk".
#
# When a release is published the APK is also attached to it as gridquake.apk.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  android:
    name: android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the APK to a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: npm run android
      # Every test build gets the same signature, so a new version installs
      # over the previous one. This is a test key, not the Play key.
      - name: Use the fixed test signing key
        run: mkdir -p ~/.android && cp android-assets/test.keystore ~/.android/debug.keystore
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Check that the APK is signed with the test key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee apk-certs.txt
          grep -q "SHA-1 digest: e1c0789cf3b4718646a7562742ce66c5512bc4f0" apk-certs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gridquake-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gridquake.apk
          gh release upload "${{ github.event.release.tag_name }}" gridquake.apk --clobber
