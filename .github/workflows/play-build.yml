name: Play Store build

# The signed app bundle (.aab) for Google Play: live ads, signed with
# the upload key. Runs when a release is published, or by hand. The bundle is
# offered as the artifact "gridquake-play" and attached to the release.
# Needs the secrets ANDROID_UPLOAD_KEYSTORE and ANDROID_UPLOAD_PASSWORD
# (see the workflow "Create upload key").
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # to attach the bundle to the release

jobs:
  bundle:
    name: play-store-bundle
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
    steps:
      - name: Check the upload key
        run: |
          if [ -z "$UPLOAD_KEYSTORE" ] || [ -z "$UPLOAD_PASSWORD" ]; then
            echo "::error::Secrets ANDROID_UPLOAD_KEYSTORE and ANDROID_UPLOAD_PASSWORD are missing (run 'Create upload key' first)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create the Android project (release)
        run: npm run android -- --release
      - name: Build the app bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Sign the bundle with the upload key
        run: |
          echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/bundle/release/app-release.aab "gridquake-$VERSION.aab"
          jarsigner -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$UPLOAD_PASSWORD" -keypass "$UPLOAD_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 "gridquake-$VERSION.aab" upload > /dev/null
          jarsigner -verify "gridquake-$VERSION.aab" | tail -1
          rm "$RUNNER_TEMP/upload.keystore"
          echo "BUNDLE=gridquake-$VERSION.aab" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: gridquake-play
          path: ${{ env.BUNDLE }}
          retention-days: 30
      - name: Attach the bundle to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$BUNDLE" --clobber
