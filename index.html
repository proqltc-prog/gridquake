<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f6fd">
<title>Gridquake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone arcade — logo bar, then one of four screens (menu, game, duels, ranking) */
:root{
  --bg:#f1f6fd; --glowA:#d3eaff; --glowB:#ffe0eb; --panel:#ffffff; --panel2:#ffffff; --surface:#ffffff; --soft:#e8eef7; --line:#d6deec;
  --fg:#2a2550; --muted:#6a6790; --accent:#ffb020; --accentText:#e07c00; --hot:#ff4f73; --cool:#22a6ee; --good:#16a35b; --ink:#3a2600;
  --lift:0 4px 0 #d4dcea, 0 8px 20px rgba(60,75,130,.08);
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;color:var(--fg);font-family:var(--body);
  background:radial-gradient(120% 60% at 10% 0%,var(--glowA) 0,transparent 55%),radial-gradient(90% 50% at 100% 100%,var(--glowB) 0,transparent 55%),var(--bg);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff3c4 0,var(--accent) 45%,#ff8a3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #c45a17)}
.hbtns{display:flex;gap:6px}
button{font:inherit;cursor:pointer;color:inherit}
.pill{background:var(--surface);box-shadow:0 2px 0 #d4dcea;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;min-width:38px}
.screen{display:flex;flex-direction:column;gap:10px}
h2.sec{font-family:var(--display);font-weight:400;font-size:18px;margin:6px 0 0;color:var(--fg)}
.muted{color:var(--muted);margin:0;font-size:14px;line-height:1.4}

/* menu */
.menu{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--lift)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d4dcea}
.mbtn b{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--fg)}
.mbtn span{color:var(--muted);font-size:13px;font-weight:700}
.mbtn .txt{min-width:0;flex:1}
.ico{flex:none;width:46px;height:46px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.ico i{border-radius:5px;background:var(--c)}
.badge{flex:none;background:var(--hot);color:#fff;font-weight:900;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.me{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.me b{font-variant-numeric:tabular-nums}
.me .who{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.me small{color:var(--muted);font-weight:700}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:900;font-size:16px;box-shadow:0 3px 0 #d4dcea}
.gbtn svg{flex:none}
.warn{background:#fff4e0;border:1px solid #ffd79a;border-radius:12px;padding:10px 12px;color:#7a4b00;font-size:13px;line-height:1.4;text-align:left}
.note{font-size:13px;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;color:var(--accentText);font-weight:800;padding:4px}

/* game */
.gtop{display:flex;align-items:center;gap:8px}
.hud{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;flex:1}
.stat{background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 #dfe5f0;border-radius:14px;padding:6px 12px;min-width:0}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900}
.stat b{display:block;font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums;line-height:1.15}
#score{font-size:30px;transform-origin:left center;
  background:linear-gradient(180deg,#ffd23f 0,#ffa51f 55%,#ff7a1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #b9520f)}
#side{font-size:22px;margin-top:4px}
#side.low{color:var(--hot)}
#score.bump{animation:bump .42s cubic-bezier(.3,1.9,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.32) rotate(-3deg)}100%{transform:scale(1)}}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--hot);color:#fff;font-size:10px;letter-spacing:.08em;vertical-align:middle}
.meter{display:flex;align-items:center;gap:8px;font-weight:900;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#ff8a3d,var(--hot));transition:width .25s}
#combo{min-width:52px;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.vs .who{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tug{height:10px;border-radius:99px;background:var(--hot);overflow:hidden}
.tug div{height:100%;width:50%;background:var(--cool);transition:width .4s}
canvas{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0;text-wrap:balance}

/* lists */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:900;padding:8px;border-radius:10px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:28px}
.row.you{background:#fff5d9;border-color:#ffd27a}
.rank{font-family:var(--display);font-size:15px;text-align:center;color:var(--muted)}
.rank.g1{color:#f2a900}.rank.g2{color:#8f99b0}.rank.g3{color:#e0773a}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.pts{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:15px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 9px;font-weight:900;font-size:13px}
.mini.go{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.drow .t{min-width:0}
.drow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow small{color:var(--muted);font-weight:700}
.res-w{color:var(--good)}.res-l{color:var(--hot)}.res-d{color:var(--accentText)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);text-align:center;font-size:14px}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--display);letter-spacing:.12em;font-size:18px;color:var(--accentText)}
input[type=text]{font:inherit;font-weight:800;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;flex:1}

.overlay{position:fixed;inset:0;background:rgba(42,48,90,.35);backdrop-filter:blur(5px);display:grid;place-items:center;padding:24px;z-index:20}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 50px rgba(40,50,100,.2);border-radius:20px;padding:22px;max-width:340px;width:100%;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.card h2{font-family:var(--display);font-weight:400;margin:0;font-size:26px;color:var(--accentText);text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.card ul{margin:0;padding:0;list-style:none;text-align:left;display:flex;flex-direction:column;gap:9px}
.card li{display:flex;gap:10px;align-items:flex-start;line-height:1.35;font-size:14px}
.card li canvas{flex:none;width:26px;height:26px}
.big{font-family:var(--display);font-size:50px;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#ffd23f,#ffa51f 55%,#ff7a1a);filter:drop-shadow(0 3px 0 #b9520f);-webkit-background-clip:text;background-clip:text;color:transparent}
.duelres{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-weight:900}
.duelres div{min-width:0;overflow:hidden;text-overflow:ellipsis}
.duelres .n{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.primary{background:linear-gradient(180deg,#ffd970,var(--accent));color:var(--ink);border:0;border-radius:14px;padding:13px;font-weight:900;font-size:16px;box-shadow:0 4px 0 #b07a12}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #b07a12}
.primary:disabled{opacity:.5}
.secondary{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:800}
.adbox{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:28px 12px;color:var(--muted);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
/* campaign */
.langrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill.gear{display:grid;place-items:center;padding:6px 10px}
.card{max-height:calc(100vh - 48px);overflow-y:auto}
.set-h{font-family:var(--display);font-weight:400;font-size:15px;margin:6px 0 0;text-align:left;color:var(--fg)}
.set-v{margin:0;text-align:left;font-weight:800;color:var(--fg)!important}
.card .note{font-size:13px;text-align:left}
.card .note.err{color:var(--hot)}
.danger{background:transparent;color:var(--hot);border:1px solid #f6b3c0;border-radius:14px;padding:12px;font-weight:800}
.danger.solid{background:var(--hot);color:#fff;border-color:var(--hot)}
#rcode{text-transform:uppercase;letter-spacing:.08em}
.langbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:800}
.langbtn.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.mbtn.hero{border:2px solid #ffc061;background:linear-gradient(180deg,#fffaf0,#fff)}
.goals{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.goal{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px 12px 3px 5px;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 #dfe5f0}
.goal b{font-weight:400}
.goal.done{background:#e8f8ee;border-color:#a6dfbb;color:var(--good)}
.goallist{display:flex;flex-direction:column;gap:8px;text-align:left}
.gl{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.gl canvas{flex:none}
.tipbox{background:#eef6ff;border:1px solid #c6e2fb;border-radius:12px;padding:10px 12px;color:#21507a;font-size:14px;line-height:1.4;text-align:left}
.movesline{font-family:var(--display);color:var(--fg)!important;font-size:18px}
.campstars{margin-left:auto;font-family:var(--display);color:var(--accentText);font-size:16px}
.camp{display:flex;flex-direction:column;gap:4px}
.wband{border-radius:16px;padding:12px 14px;background:var(--wc);color:#fff;display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 0 rgba(0,0,0,.12);margin-top:10px}
.wband b{font-family:var(--display);font-weight:400;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.wband span{font-size:13px;font-weight:700;line-height:1.35}
.path{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:12px}
.node{transform:translateX(var(--x));width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55) 0,transparent 42%),var(--wc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.16),0 8px 16px rgba(40,50,100,.12);padding:0}
.node.boss{width:72px;height:72px}
.node .num{font-family:var(--display);font-size:20px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.node .stars{display:flex;font-size:11px;line-height:1;margin-top:3px;color:rgba(255,255,255,.45)}
.node .stars .on{color:#fff3a6;text-shadow:0 1px 0 #b36b00}
.node.locked{background:var(--soft);color:var(--muted);border-color:var(--line);box-shadow:0 4px 0 #d4dcea}
.node.locked .num{text-shadow:none;font-size:18px}
.node .lk{font-size:10px;line-height:1;margin-top:2px}
.node.cur{animation:nodepulse 1.3s ease-in-out infinite;box-shadow:0 0 0 6px rgba(255,176,32,.35),0 5px 0 rgba(0,0,0,.16)}
@keyframes nodepulse{50%{transform:translateX(var(--x)) scale(1.1)}}
.stars-big,.stars-mid{display:flex;justify-content:center;gap:6px;font-size:44px;line-height:1;color:#e3e8f1}
.stars-mid{font-size:26px}
.stars-big .on,.stars-mid .on{color:#ffb020;text-shadow:0 3px 0 #c46a00}
.stars-big .popin{animation:starpop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
@media (prefers-reduced-motion: reduce){#score.bump,.card,.node.cur,.stars-big .popin{animation:none}}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1 class="logo">GRIDQUAKE</h1>
    <div class="hbtns"><button class="pill" id="mute" aria-label="Geluid aan of uit" data-ta>🔊</button><button class="pill gear" id="settings" aria-label="Instellingen" data-ta><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button></div>
  </header>

  <section class="screen" id="s-menu">
    <div class="menu">
      <button class="mbtn hero" id="go-camp">
        <span class="ico" aria-hidden="true"><i style="--c:#ff8a3d"></i><i style="--c:#2fb4f0"></i><i style="--c:#9a6cf5"></i><i style="--c:#2fbf6a"></i></span>
        <span class="txt"><b data-t>Campagne</b><span id="camp-sub">75 levels in 5 werelden, elk met een nieuw obstakel.</span></span>
      </button>
      <button class="mbtn" id="go-classic">
        <span class="ico" aria-hidden="true"><i style="--c:#ff5f7e"></i><i style="--c:#ffd84d"></i><i style="--c:#3fc6ff"></i><i style="--c:#4fdc8a"></i></span>
        <span class="txt"><b data-t>Klassiek</b><span data-t>Solo spelen tot het bord vol zit. Jaag op je record.</span></span>
      </button>
      <button class="mbtn" id="go-mp">
        <span class="ico" aria-hidden="true"><i style="--c:#3fc6ff"></i><i style="--c:#ff5f7e"></i><i style="--c:#ff5f7e"></i><i style="--c:#3fc6ff"></i></span>
        <span class="txt"><b data-t>Multiplayer</b><span data-t>Duel van 20 zetten met dezelfde blokken, tegen een willekeurige speler of een vriend.</span></span>
        <span class="badge" id="mp-badge" hidden>0</span>
      </button>
      <button class="mbtn" id="go-lb">
        <span class="ico" aria-hidden="true"><i style="--c:#ffd84d"></i><i style="--c:#ffd84d"></i><i style="--c:#a77bff"></i><i style="--c:#ff9a3d"></i></span>
        <span class="txt"><b data-t>Klassement</b><span data-t>Wereld, deze week en je vrienden.</span></span>
      </button>
    </div>
    <div class="me"><span class="who"><span id="me-name">–</span></span><span><span data-t>Record</span> <b id="me-best">0</b></span></div>
    <button class="linkbtn" id="how" data-t>Hoe werken power-blokken?</button>
  </section>

  <section class="screen" id="s-game" hidden>
    <div class="gtop">
      <button class="pill" id="g-back" aria-label="Terug naar menu" data-ta>✕</button>
      <div class="hud">
        <div class="stat"><span>Score</span><b id="score">0</b></div>
        <div class="stat"><span id="side-l">Beste</span><b id="side">0</b></div>
      </div>
    </div>
    <div class="goals" id="goals" hidden></div>
    <div class="meter"><span>Combo</span><div class="bar"><div class="fill" id="fill"></div></div><span id="combo">–</span></div>
    <div class="vs" id="vs" hidden><span class="who" id="vs-me">Jij 0</span><div class="tug"><div id="tug"></div></div><span class="who" id="vs-op">0</span></div>
    <canvas id="cv" aria-label="Speelbord"></canvas>
    <p class="hint" id="hint">Wis 2 lijnen tegelijk voor een Raket, 3 voor een Bom en een kleurlijn voor een Prisma.</p>
  </section>

  <section class="screen" id="s-camp" hidden>
    <div class="gtop"><button class="pill" data-back aria-label="Terug naar menu" data-ta>←</button><h2 class="sec" data-t>Campagne</h2><span class="campstars" id="camp-stars"></span></div>
    <div id="camp-body" class="camp"></div>
  </section>

  <section class="screen" id="s-mp" hidden>
    <div class="gtop"><button class="pill" data-back aria-label="Terug naar menu" data-ta>←</button><h2 class="sec" data-t>Multiplayer</h2></div>
    <div id="mp-body" class="screen"></div>
  </section>

  <section class="screen" id="s-lb" hidden>
    <div class="gtop"><button class="pill" data-back aria-label="Terug naar menu" data-ta>←</button><h2 class="sec" data-t>Klassement</h2></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-world" aria-selected="true" data-t>Wereld</button>
      <button role="tab" id="t-week" aria-selected="false" data-t>Week</button>
      <button role="tab" id="t-friends" aria-selected="false" data-t>Vrienden</button>
    </div>
    <div id="lb-body" class="screen"></div>
  </section>

</div>
<div class="overlay" id="ov" hidden><div class="card" id="ovcard"></div></div>

<script>
(()=>{
const CS=40, PAD=20, BOARD=8*CS, TRAY_Y=PAD+BOARD+18, TRAY_H=130, W=BOARD+PAD*2, H=TRAY_Y+TRAY_H, TS=22, LIFT=84, DUEL_MOVES=20;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const now=()=>performance.now();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

const grid0=()=>Array.from({length:N},()=>Array(N).fill(null));
const zero0=()=>Array.from({length:N},()=>Array(N).fill(0));

/* ---------- level generator ---------- */
const PATS=['scatter','center','ring','corners','diag','cols','rows'];
function patternOrder(kind,rng){
  const all=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)all.push([r,c,rng()]);
  const key={scatter:([r,c,j])=>j,
    center:([r,c,j])=>Math.hypot(r-3.5,c-3.5)+j*.6,
    ring:([r,c,j])=>Math.abs(Math.max(Math.abs(r-3.5),Math.abs(c-3.5))-2.5)+j*.6,
    corners:([r,c,j])=>-Math.hypot(r-3.5,c-3.5)+j*.6,
    diag:([r,c,j])=>Math.min(Math.abs(r-c),Math.abs(r+c-7))+j*.9,
    cols:([r,c,j])=>Math.min(Math.abs(c-2),Math.abs(c-5))*2+j,
    rows:([r,c,j])=>Math.min(Math.abs(r-2),Math.abs(r-5))*2+j}[kind];
  return all.sort((a,b)=>key(a)-key(b)).map(([r,c])=>[r,c]);
}
function makeLevel(n,scale){
  const w=Math.floor((n-1)/15), i=(n-1)%15, rng=mulberry32(n*7919+13);
  const hard=i%5===4, easy=i%5===0&&i>0, sc=(scale||LSCALE)[n]||1;
  const k=v=>Math.max(1,Math.round(v*sc*(hard?1.2:easy?.8:1)));
  const lv={n,w,i,seed:(n*2654435761)>>>0,goals:[],cells:[],ice:[],drop:0,dropMax:2,moss:0,mossN:1,hard,easy};
  const occ=new Set();
  const pat=()=>PATS[Math.floor(rng()*PATS.length)];
  const col=()=>COLORS[Math.floor(rng()*COLORS.length)];
  const put=(kind,count,make)=>{const o=patternOrder(kind,rng);let m=0;
    for(const [r,c] of o){if(m>=count)break;const q=r*N+c;if(occ.has(q))continue;occ.add(q);lv.cells.push({r,c,...make(m)});m++;}return m;};
  const ice=(count,goal)=>{const o=patternOrder(pat(),rng),s=new Set(lv.ice.map(([r,c])=>r*N+c));let m=0;
    for(const [r,c] of o){if(m>=count)break;const q=r*N+c;if(s.has(q))continue;const x=lv.cells.find(e=>e.r===r&&e.c===c);if(x&&x.t!=='block')continue;s.add(q);lv.ice.push([r,c]);m++;}
    if(goal)lv.goals.push({t:'ice'});};
  const stones=(cnt,goal,str3,soft)=>{const m=put(pat(),cnt,j=>({t:'stone',v:soft===1?1:soft===.5?(j%2?2:1):str3&&j%3===2?3:2}));if(goal)lv.goals.push({t:'stones',target:m});};
  const locks=(cnt,goal)=>{put(pat(),cnt,()=>({t:'lock',color:col()}));if(goal)lv.goals.push({t:'locks'});};
  const moss=(cnt,goal,every)=>{put(pat(),cnt,()=>({t:'moss'}));lv.moss=every;if(goal)lv.goals.push({t:'moss'});};
  const junk=cnt=>put(pat(),cnt,()=>({t:'block',color:col()}));
  const scoreLv=i===6;
  if(w===0){
    stones(k(3+i*.4),!scoreLv,i>=11,i<5?1:i<10?.5:0);
    if(i%5===3)junk(6);
    if(i>=9)lv.drop=4;
    if(i%5===2)lv.goals.push({t:'make',sp:'raket',target:1});
  }else if(w===1){
    if(i%3===1)junk(5+Math.floor(i/3));
    ice(k(6+i*.9),!scoreLv);
    if(i>=6)stones(k(2+(i-6)*.3),i>=10,false,.5);
    if(i%5===2)lv.goals.push({t:'make',sp:'raket',target:1});
  }else if(w===2){
    locks(k(3+i*.45),!scoreLv);
    if(i>=5)ice(k(5+(i-5)*.6),i>=9);
    if(i%2===1&&i<9)stones(2,false,false,1);
    if(i%5===2)lv.goals.push({t:'make',sp:'raket',target:1});
  }else if(w===3){
    moss(k(2+i*.2),!scoreLv,i>=10?2:3);
    if(i>=5)locks(k(3+(i-5)*.3),i>=10);
  }else{
    const m=i%3;
    if(m===0){stones(k(3+i*.2),true,true,i<6?.5:0);ice(k(8+i*.4),true);}
    else if(m===1){locks(k(3+i*.25),true);moss(k(2+i*.12),true,3);}
    else{ice(k(7+i*.4),true);locks(k(3+i*.25),true);}
    if(i>=8){lv.drop=4;lv.dropMax=3;}
  }
  if(scoreLv)lv.goals=[{t:'score',target:Math.round((700+n*14)*sc/50)*50}];
  // never start with a full row or column
  for(let guard=0;guard<20;guard++){
    const g=grid0();lv.cells.forEach(e=>g[e.r][e.c]=1);let fixed=false;
    for(let x=0;x<N&&!fixed;x++){
      if(g[x].every(Boolean)){const j=lv.cells.findIndex(e=>e.r===x&&e.t==='block')>=0?lv.cells.findIndex(e=>e.r===x&&e.t==='block'):lv.cells.findIndex(e=>e.r===x);lv.cells.splice(j,1);fixed=true;}
      else if(g.every(row=>row[x])){const j=lv.cells.findIndex(e=>e.c===x);lv.cells.splice(j,1);fixed=true;}}
    if(!fixed)break;
  }
  lv.goals.forEach(g=>{if(g.t==='stones')g.target=Math.min(g.target,lv.cells.filter(e=>e.t==='stone').length)||1;});
  const t=TUNE[n-1];lv.moves=t?t[0]:30;lv.stars=t?[t[1],t[2]]:[1500,3000];
  return lv;
}

/* ---------- state & rules ---------- */
function newState(o){
  const st={mode:o.mode,lvl:o.lvl||null,grid:grid0(),ice:zero0(),tray:[],score:0,combo:0,rounds:0,moves:0,
    prng:mulberry32(o.seed),srng:mulberry32(o.seed^0x5bd1e995),stats:{stones:0,made:{raket:0,bom:0,prisma:0},unlocked:0,ice:0,moss:0}};
  if(st.lvl){
    for(const e of st.lvl.cells)st.grid[e.r][e.c]=e.t==='stone'?{stone:e.v,max:e.v}:e.t==='lock'?{color:e.color,lock:true}:e.t==='moss'?{moss:true}:{color:e.color};
    for(const [r,c] of st.lvl.ice)st.ice[r][c]=1;
  }
  return st;
}
function fitsG(st,p,r,c){return p.cells.every(([dr,dc])=>{const R=r+dr,K=c+dc;return R>=0&&K>=0&&R<N&&K<N&&!st.grid[R][K]})}
function fitsAnyG(st,p){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fitsG(st,p,r,c))return true;return false}
function fullLines(g){const rows=[],cols=[];for(let i=0;i<N;i++){if(g[i].every(x=>x))rows.push(i);if(g.every(row=>row[i]))cols.push(i);}return {rows,cols};}
function newPiece(st,fill=0){let cells=SHAPES[Math.floor(st.prng()*SHAPES.length)];
  // on a crowded board big shapes are re-drawn more often (never in duels: both players must get the same blocks)
  if(fill>0&&cells.length>=5&&st.prng()<fill*1.3)cells=SHAPES[Math.floor(st.prng()*SHAPES.length)];
  if(fill>.55&&cells.length>=6&&st.prng()<fill)cells=SHAPES[Math.floor(st.prng()*14)];
  return {cells,color:COLORS[Math.floor(st.prng()*COLORS.length)],w:Math.max(...cells.map(p=>p[1]))+1,h:Math.max(...cells.map(p=>p[0]))+1};}
const countFilled=st=>st.grid.reduce((s,row)=>s+row.filter(Boolean).length,0);
function canClear(st,p){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!fitsG(st,p,r,c))continue;
    const set=new Set(p.cells.map(([a,b])=>(r+a)*N+c+b));
    for(const [a,b] of p.cells){const R=r+a,K=c+b;
      let row=true,col=true;for(let x=0;x<N;x++){if(!st.grid[R][x]&&!set.has(R*N+x))row=false;if(!st.grid[x][K]&&!set.has(x*N+K))col=false;}
      if(row||col)return true;}}
  return false;
}
function dropStone(st){
  const k0=Math.floor(st.srng()*N*N);let k=-1;
  for(let i=0;i<N*N;i++){const j=(k0+i)%(N*N);if(!st.grid[Math.floor(j/N)][j%N]){k=j;break;}}
  if(k<0)return null;
  const r=Math.floor(k/N),c=k%N,m=st.lvl?st.lvl.dropMax:(st.rounds>=25?3:2);
  st.grid[r][c]={stone:m,max:m};return {r,c};
}
function refillG(st,noStone){
  st.rounds++;const out={drop:null,bonus:-1};
  const every=st.lvl?st.lvl.drop:3;
  if(!noStone&&every&&st.rounds>1&&(st.rounds-1)%every===0)out.drop=dropStone(st);
  if(st.mode==='duel')st.tray=[newPiece(st),newPiece(st),newPiece(st)];
  else{
    // fair generator: prefer sets that fit, and on a crowded board one that can finish a line
    const fill=countFilled(st)/(N*N);let best=null,bs=-1;
    for(let t=0;t<8;t++){const tr=[newPiece(st,fill),newPiece(st,fill),newPiece(st,fill)];
      const fc=tr.filter(p=>fitsAnyG(st,p)).length,help=fill>=.5&&tr.some(p=>canClear(st,p));
      const s=fc*10+(help?5:0);if(s>bs){bs=s;best=tr;}
      if(fc===3&&(fill<.5||help))break;}
    st.tray=best;
  }
  if(st.rounds%4===0){const i=Math.floor(st.prng()*3),u=st.prng(),roll=st.prng(),p=st.tray[i];
    p.bonus={cell:Math.floor(u*p.cells.length),sp:roll<.6?'raket':roll<.9?'bom':'prisma'};out.bonus=i;}
  return out;
}
// campaign: when nothing fits, deal new blocks instead of ending the level
function rerollTray(st){
  for(let t=0;t<20;t++){const tr=[newPiece(st),newPiece(st),newPiece(st)];if(tr.some(p=>fitsAnyG(st,p))){st.tray=tr;return true;}}
  const one={cells:[[0,0]],color:COLORS[Math.floor(st.prng()*COLORS.length)],w:1,h:1};
  st.tray=[one,{...one},{...one}];return st.tray.some(p=>fitsAnyG(st,p));
}
const trayStuck=st=>!st.tray.some(p=>p&&fitsAnyG(st,p));
const countIf=(st,f)=>{let n=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(f(st.grid[r][c],r,c))n++;return n;};
function spreadMoss(st){
  const out=[];
  for(let t=0;t<(st.lvl.mossN||1);t++){
    const cand=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=st.grid[r][c];if(!x||!x.moss)continue;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const R=r+dr,K=c+dc;if(R>=0&&K>=0&&R<N&&K<N&&!st.grid[R][K])cand.push([R,K]);});}
    if(!cand.length)break;
    const [r,c]=cand[Math.floor(st.srng()*cand.length)];st.grid[r][c]={moss:true};out.push([r,c]);
  }
  return out;
}
function areaOf(st,cell,r,c){
  const out=[];
  if(cell.sp==='raket'){for(let k=0;k<N;k++){if(k!==c)out.push([r,k]);if(k!==r)out.push([k,c]);}}
  else if(cell.sp==='bom'){for(let a=r-2;a<=r+2;a++)for(let b=c-2;b<=c+2;b++)if(a>=0&&b>=0&&a<N&&b<N&&Math.abs(a-r)+Math.abs(b-c)<=3&&!(a===r&&b===c))out.push([a,b]);}
  else if(cell.sp==='prisma'){for(let a=0;a<N;a++)for(let b=0;b<N;b++){const x=st.grid[a][b];if(x&&!x.stone&&x.color===cell.color&&!(a===r&&b===c))out.push([a,b]);}}
  return out;
}
// Breadth-first through detonations. Each event: hit | break (stone) | unlock (chain) | remove (block, moss, power block)
function resolveG(st,start){
  const done=new Set(),remove=[],events=[];
  const q=start.map(s=>({...s,par:-1,w:0}));
  let det=0,broken=0,hits=0,unl=0,iceB=0,mossC=0,chain=0,dets=0;
  while(q.length){
    q.sort((x,y)=>x.w-y.w);
    const it=q.shift(),key=it.a*N+it.b;
    if(done.has(key))continue;done.add(key);
    const cell=st.grid[it.a][it.b];if(!cell)continue;
    const ev={a:it.a,b:it.b,par:it.par,w:it.w,d:it.d,o:it.o,cell};
    if(cell.stone){hits++;cell.stone--;if(cell.stone<=0){broken++;ev.kind='break';remove.push([it.a,it.b]);}else ev.kind='hit';}
    else if(cell.lock){cell.lock=false;unl++;ev.kind='unlock';}
    else{
      ev.kind='remove';remove.push([it.a,it.b]);if(cell.moss)mossC++;
      if(cell.sp){const area=areaOf(st,cell,it.a,it.b),lvl=it.w+1;chain=Math.max(chain,lvl);dets++;
        det+=(SPBON[cell.sp]+5*area.length)*lvl;ev.sp=cell.sp;ev.area=area;ev.lvl=lvl;
        const idx=events.length;area.forEach(([a,b])=>q.push({a,b,par:idx,w:lvl}));}
    }
    if((ev.kind==='remove'||ev.kind==='break')&&st.ice[it.a][it.b]>0){st.ice[it.a][it.b]--;ev.ice=true;iceB++;}
    events.push(ev);
  }
  remove.forEach(([a,b])=>{st.grid[a][b]=null;});
  st.stats.stones+=broken;st.stats.unlocked+=unl;st.stats.ice+=iceB;st.stats.moss+=mossC;
  return {events,detScore:det,broken,hits,unlocked:unl,iceBroken:iceB,moss:mossC,dets,chain};
}
function applyMove(st,idx,r,c){
  const p=st.tray[idx];
  p.cells.forEach(([dr,dc],i)=>{st.grid[r+dr][c+dc]=p.bonus&&p.bonus.cell===i?{color:p.color,sp:p.bonus.sp}:{color:p.color};});
  st.score+=p.cells.length;
  const {rows,cols}=fullLines(st.grid),L=rows.length+cols.length;
  const rep={p,r,c,L,rows,cols,colorLines:0,res:null,gain:p.cells.length,forged:null,clean:false,mult:1,refill:null,moss:null};
  if(L){
    const start=[];
    const lines=[...rows.map(R=>Array.from({length:N},(_,k)=>[R,k])),...cols.map(K=>Array.from({length:N},(_,k)=>[k,K]))];
    lines.forEach(cs=>{const xs=cs.map(([a,b])=>st.grid[a][b]);
      if(xs.every(x=>x.color&&!x.stone&&x.color===xs[0].color))rep.colorLines++;
      cs.forEach(([a,b])=>start.push({a,b}));});
    const res=resolveG(st,start);rep.res=res;
    st.combo++;rep.mult=1+(st.combo-1)*.5;
    rep.clean=st.grid.every(row=>row.every(x=>!x));
    const lineScore=10*L*(L+1)*Math.pow(2,rep.colorLines);
    const g=Math.round((lineScore+res.detScore+(rep.clean?500:0))*rep.mult)+res.broken*50;
    st.score+=g;rep.gain+=g;
    const sp=(rep.colorLines||L>=4)?'prisma':L>=3?'bom':L===2?'raket':null;
    if(sp){const pc=[r+(p.h-1)/2,c+(p.w-1)/2];
      const cand=p.cells.map(([a,b])=>[r+a,c+b]).filter(([a,b])=>!st.grid[a][b]).sort((u,v)=>Math.hypot(u[0]-pc[0],u[1]-pc[1])-Math.hypot(v[0]-pc[0],v[1]-pc[1]));
      if(cand.length){const [a,b]=cand[0];st.grid[a][b]={color:p.color,sp,appear:1};st.stats.made[sp]++;rep.forged={a,b,sp};}}
  } else st.combo=0;
  st.tray[idx]=null;st.moves++;
  if(st.tray.every(x=>!x))rep.refill=refillG(st);
  if(st.lvl&&st.lvl.moss&&st.moves%st.lvl.moss===0)rep.moss=spreadMoss(st);
  return rep;
}
function finaleG(st){
  const start=[];for(let a=0;a<N;a++)for(let b=0;b<N;b++){const x=st.grid[a][b];if(x&&x.sp)start.push({a,b,d:start.length*260,o:[a,b]});}
  if(!start.length)return null;
  const res=resolveG(st,start);res.pts=res.detScore+res.broken*50;st.score+=res.pts;return res;
}
function goalLeft(st,g){
  if(g.t==='stones')return Math.max(0,g.target-st.stats.stones);
  if(g.t==='ice')return st.ice.reduce((s,row)=>s+row.filter(v=>v>0).length,0);
  if(g.t==='locks')return countIf(st,x=>x&&x.lock);
  if(g.t==='moss')return countIf(st,x=>x&&x.moss);
  if(g.t==='make')return Math.max(0,g.target-st.stats.made[g.sp]);
  if(g.t==='score')return Math.max(0,g.target-st.score);
  return 0;
}
const levelWon=st=>st.lvl.goals.every(g=>goalLeft(st,g)===0);
const levelStars=(lv,score)=>score>=lv.stars[1]?3:score>=lv.stars[0]?2:1;

function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function mix(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=amt>0?255:0,p=Math.abs(amt);
  r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return`rgb(${r},${g},${b})`}
function sprite(s,draw){const c=document.createElement('canvas');c.width=c.height=Math.ceil(s*dpr);const g=c.getContext('2d');g.scale(dpr,dpr);draw(g,s);return c}

/* turn engine events into timed animations; returns when the last one ends */
function animateEvents(res,T,cx,cy){
  const times=[];let end=T,krak=false;
  res.events.forEach(ev=>{
    const x=PAD+ev.b*CS,y=PAD+ev.a*CS;let ox,oy,tb;
    if(ev.par<0){[ox,oy]=ev.o?cellXY(ev.a,ev.b):[cx,cy];tb=T+(ev.d||0);}
    else{const pe=res.events[ev.par];[ox,oy]=cellXY(pe.a,pe.b);tb=times[ev.par]+90;}
    const t0=tb+Math.hypot(x+CS/2-ox,y+CS/2-oy)*1.1;times.push(t0);end=Math.max(end,t0+450);
    const cell=ev.cell;
    if(ev.kind==='hit')S.born[ev.a][ev.b]=t0;
    else if(ev.kind==='break'){dying.push({x,y,spr:STONE['1/'+cell.max],t0,stone:true});if(!krak){krak=true;pop(tx('Krak!'),x+CS/2,y,'info','#8f99b0',null,t0);}}
    else if(ev.kind==='unlock'){S.born[ev.a][ev.b]=t0;dying.push({x,y,spr:LOCK,t0,col:'#8f99b0'});}
    else dying.push({x,y,spr:cellSprite(cell),col:cell.moss?'#3fae5f':cell.color,t0});
    if(ev.ice)dying.push({x,y,spr:ICE,t0:t0+40,col:'#8fd3ff'});
    if(ev.sp){effects.push({type:ev.sp,r:ev.a,c:ev.b,color:cell.color,t0,area:ev.area});
      if(ev.lvl>=2)pop(tx('Ketting ×{n}',{n:ev.lvl}),x+CS/2,y+24,'info','#e07c00',null,t0+160);
      const sp=ev.sp;at(t0,()=>{sfx[sp]();buzz(sp==='bom'?50:25);if(!reduced)shake=Math.max(shake,sp==='bom'?14:8);});}
  });
  if(res.hits)at(T+120,res.broken?sfx.smash:sfx.hit);
  if(res.unlocked)at(T+150,sfx.unlock);
  if(res.iceBroken)at(T+90,sfx.ice);
  return end;
}
function calloutFor(rep,power){
  const L=rep.L;
  if(rep.clean)return tx('SCHOON BORD!');
  if(power>=6)return 'BLOCKBUSTER!';
  if(rep.res.chain>=2)return tx('Kettingreactie!');
  if(L>=4)return tx('Viervoud!');
  if(L===3)return tx('Driedubbel!');
  if(rep.rows.length&&rep.cols.length)return tx('Kruisvuur!');
  if(L===2)return tx('Dubbel!');
  if(S.combo>=3)return tx('Reeks van {n}!',{n:S.combo});
  return null;
}
function place(idx,r,c){
  const T=now(),p=S.tray[idx],cx=PAD+(c+p.w/2)*CS,cy=PAD+(r+p.h/2)*CS;
  const rep=applyMove(S,idx,r,c);
  p.cells.forEach(([a,b])=>S.born[r+a][c+b]=T);
  sfx.place();buzz(12);
  let endT=T+300;const total=rep.gain;
  if(rep.L){
    const res=rep.res;endT=animateEvents(res,T,cx,cy);
    if(rep.forged){const {a,b,sp}=rep.forged,t=endT-200;S.grid[a][b].appear=t;S.born[a][b]=t;
      pop(tx(SPNAME[sp])+'!',PAD+b*CS+CS/2,PAD+a*CS-8,'info',mix(p.color,-.15),null,t);at(t,sfx.make);}
    sfx.clear(rep.L,S.combo);buzz(rep.L>1?[30,40,30]:25);
    const ts=T+120,tp=res.dets?Math.max(ts,endT-300):ts;
    pop('+'+total,cx,cy,'score',null,Math.min(50,28+total/30),tp);
    const G=S;at(tp,()=>{G.shown+=total;if(G===S)bump();});
    const power=rep.L+res.dets*1.2+(S.combo-1)*.6+rep.colorLines;
    const call=calloutFor(rep,power);
    if(call)pop(call,W/2,PAD+BOARD*.42,'callout',null,null,endT-250);
    if(S.combo>1)pop('Combo ×'+dec(rep.mult),cx,cy+38,'info','#e07c00',null,ts);
    if(rep.colorLines)pop(tx('Kleurlijn ×{n}',{n:Math.pow(2,rep.colorLines)}),cx,cy+62,'info',mix(p.color,-.2),null,ts);
    if(power>=3||rep.clean){at(endT-250,()=>{flash=power>=5||rep.clean?.5:.3;if(!reduced)shake=Math.max(shake,10+power*2);confetti(Math.min(140,power*22));sfx.cheer(Math.min(3,Math.floor(power/2)));});}
  } else S.shown+=total;
  S.prog.push(S.score);
  if(S.mode!=='classic')S.movesLeft--;
  if(rep.refill)refillFx(rep.refill);

    const [a,b]=rep.moss[0];pop(tx('Mos groeit!'),PAD+b*CS+CS/2,PAD+a*CS-6,'info','#2f9b55',null,t);at(t,sfx.grow);}
  checkRecord();hud();

    if(levelWon(S)){S.lock=true;setTimeout(winLevel,wait);}
    else if(S.movesLeft<=0){S.lock=true;setTimeout(()=>loseLevel('moves'),wait);}
    else if(trayStuck(S)){S.lock=true;setTimeout(()=>loseLevel('space'),wait+300);}

  else if(!S.tray.some(x=>x&&fitsAny(x))){S.lock=true;setTimeout(endGame,wait+300);}
}

const CAMPKEY='blockers-camp';
let CAMP=(()=>{try{const c=JSON.parse(store.get(CAMPKEY)||'{}');return {s:c.s||{},b:c.b||{}};}catch(e){return {s:{},b:{}};}})();
const campStars=()=>Object.values(CAMP.s).reduce((a,b)=>a+b,0);
const campUnlocked=n=>n===1||(CAMP.s[n-1]||0)>0;
const campNext=()=>{for(let n=1;n<=LEVELS;n++)if(!CAMP.s[n])return n;return LEVELS;};
function campSave(n,stars,score){
  let ch=false;
  if(stars>(CAMP.s[n]||0)){CAMP.s[n]=stars;ch=true;}
  if(score>(CAMP.b[n]||0)){CAMP.b[n]=score;ch=true;}
  if(ch){store.set(CAMPKEY,JSON.stringify(CAMP));pushCamp(n);}
}
function mergeCamp(remote){
  if(!remote)return false;let more=false;
  Object.entries(remote).forEach(([n,s])=>{if(s>(CAMP.s[n]||0))CAMP.s[n]=s;});
  Object.entries(CAMP.s).forEach(([n,s])=>{if(s>(remote[n]||0))more=true;});
  store.set(CAMPKEY,JSON.stringify(CAMP));return more;
}
function goalText(g,lv){
  const cnt=t=>lv.cells.filter(e=>e.t===t).length;
  if(g.t==='stones')return tx(g.target===1?'Breek {n} steen':'Breek {n} stenen',{n:g.target});
  if(g.t==='ice')return tx('Breek al het ijs ({n} vakjes)',{n:lv.ice.length});
  if(g.t==='locks')return tx('Bevrijd alle {n} geketende blokken',{n:cnt('lock')});
  if(g.t==='moss')return tx('Ruim al het mos op');
  if(g.t==='make')return tx('Maak {n} {x}',{n:g.target,x:tx(g.target>1?SPPLUR[g.sp]:SPNAME[g.sp])});
  if(g.t==='score')return tx('Haal {n} punten',{n:g.target});
  return '';
}
function goalIcon(g,size=26){
  const c=el('canvas');c.width=c.height=Math.round(size*2);c.style.width=c.style.height=size+'px';
  const x=c.getContext('2d');x.scale(size*2/CS,size*2/CS);
  if(g.t==='stones')x.drawImage(STONE['2/2'],0,0,CS,CS);
  else if(g.t==='ice')x.drawImage(ICE,0,0,CS,CS);
  else if(g.t==='locks'){x.drawImage(SPR['#a77bff'],0,0,CS,CS);x.drawImage(LOCK,0,0,CS,CS);}
  else if(g.t==='moss')x.drawImage(MOSS,0,0,CS,CS);
  else if(g.t==='make')x.drawImage(SPX[g.sp]['#3fc6ff'],0,0,CS,CS);
  else{x.fillStyle='#ffb020';x.strokeStyle='#c46a00';x.lineWidth=2;x.beginPath();
    for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:17;x.lineTo(20+Math.cos(a)*r,21+Math.sin(a)*r);}x.closePath();x.fill();x.stroke();}
  return c;
}
function renderGoals(){

  WORLDS.forEach((wd,w)=>{
    const band=el('div','wband');band.style.setProperty('--wc',wd.color);

    band.append(el('b',null,(w+1)+'. '+tx(wd.name)),el('span',null,campUnlocked(first)?'★ '+got+' / 45 · '+tx(wd.tip):tx('Haal level {n} om deze wereld te openen.',{n:first-1})));
    const path=el('div','path');

/* ---------- ads (AdMob in the Android app, a stand-in in the browser) ---------- */
// The Play Store build switches AD_LIVE on (scripts/android.mjs --release). Test builds
// and the owner's test APKs always use Google's test ads.
const AD_LIVE=false;
const AD_UNITS=AD_LIVE?{reward:'ca-app-pub-8394022188610476/2251067197',inter:'ca-app-pub-8394022188610476/7834566366'}
  :{reward:'ca-app-pub-3940256099942544/5224354917',inter:'ca-app-pub-3940256099942544/1033173712'};
const ADS={plugin:null,privacy:false,busy:false,got:false,closed:null};
const inApp=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
// Starts AdMob and asks Google's EU consent question when needed. A failure never stops the game.
async function initAds(){
  const a=window.Capacitor?.Plugins?.AdMob;if(!a)return;
  try{await a.initialize({initializeForTesting:!AD_LIVE});}catch(e){return;}
  try{let c=await a.requestConsentInfo();
    if(c&&c.isConsentFormAvailable&&c.status==='REQUIRED')c=(await a.showConsentForm())||c;
    ADS.privacy=!!c&&c.privacyOptionsRequirementStatus==='REQUIRED';}catch(e){}
  const gone=()=>{if(ADS.closed)ADS.closed();};
  try{a.addListener('onRewardedVideoAdReward',()=>{ADS.got=true;});
    ['onRewardedVideoAdDismissed','onRewardedVideoAdFailedToShow','interstitialAdDismissed','interstitialAdFailedToShow'].forEach(e=>a.addListener(e,gone));}catch(e){}
  ADS.plugin=a;
}
// Waits until the ad is gone from the screen (closed or failed), at most a minute.
const adGone=()=>new Promise(r=>{ADS.closed=r;setTimeout(r,60000);});
// The browser stand-in: a short countdown instead of a real ad.
function fakeAd(label,done){
  let s=3;const tick=()=>{const box=el('div','adbox');box.append(label,el('br'),tx('Hier komt de AdMob-advertentie'));
    showCard([el('h2',null,tx('Reclame')),box,el('p',null,tx('Nog {n} s',{n:s}))]);
    if(s--<=0){closeCard();done();}else setTimeout(tick,1000);};tick();
}
// A rewarded video. Watched to the end: done(). Closed early: back to the previous card.
// No video available (offline, no ad): the player gets the reward anyway and is never stuck.
async function rewardAd(label,done){
  if(!inApp())return fakeAd(label,done);
  if(!ADS.plugin){closeCard();return done();}
  if(ADS.busy)return;ADS.busy=true;ADS.got=false;
  const prev=[...card.children];showCard([el('h2',null,tx('Reclame laden…'))]);
  let item=null,failed=false;
  try{const gone=adGone();await ADS.plugin.prepareRewardVideoAd({adId:AD_UNITS.reward,isTesting:!AD_LIVE});
    item=await ADS.plugin.showRewardVideoAd();await gone;}catch(e){failed=true;}
  ADS.closed=null;ADS.busy=false;
  if(failed||ADS.got||(item&&item.amount)){closeCard();done();}else showCard(prev);
}
// An interstitial after every 5th game; whatever happens, the game goes on with fn.
async function interAd(fn){
  if(!inApp())return fakeAd(tx('Tussenreclame (na elk 5e spel)'),fn);
  if(!ADS.plugin||ADS.busy)return fn();
  ADS.busy=true;
  try{const gone=adGone();await ADS.plugin.prepareInterstitial({adId:AD_UNITS.inter,isTesting:!AD_LIVE});
    await ADS.plugin.showInterstitial();await gone;}catch(e){}
  ADS.closed=null;ADS.busy=false;fn();
}

  const c=Math.round((cx-p.w*CS/2-PAD)/CS),r=Math.round((cy-p.h*CS/2-PAD)/CS);

function drawSpr(spr,x,y,s,scale=1,alpha=1,rot=0){

}
function star(x,y,s){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?s*.3:s;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fill()}

  effects=effects.filter(e=>{
    const a=(T-e.t0)/480;if(a>1)return false;if(a<0)return true;
    const cx=PAD+e.c*CS+CS/2,cy=PAD+e.r*CS+CS/2;
    ctx.save();ctx.shadowColor=e.color;ctx.shadowBlur=22;
    if(e.type==='raket'){
      const len=BOARD*Math.min(1,a*2.4),th=CS*.62*(1-a*.7);ctx.globalAlpha=1-a*a;
      ctx.fillStyle=e.color;ctx.fillRect(cx-len,cy-th/2,len*2,th);ctx.fillRect(cx-th/2,cy-len,th,len*2);
      ctx.fillStyle='#fff';ctx.fillRect(cx-len,cy-th/6,len*2,th/3);ctx.fillRect(cx-th/6,cy-len,th/3,len*2);
    }else if(e.type==='bom'){
      const rad=CS*.3+a*CS*3;ctx.globalAlpha=(1-a)*.45;ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.fill();
      ctx.globalAlpha=1-a;ctx.strokeStyle=e.color;ctx.lineWidth=12*(1-a)+1;ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.stroke();

      if(!mine){t=tx('Nog niet gespeeld');}
      else if(!o){t=tx('Zoekt tegenstander · jij {n}',{n:mine.score});}
      else if(!theirs){t=tx('Wacht op {x} · jij {n}',{x:nickOf(o),n:mine.score});}
      else{const w=mine.score>theirs.score?'w':mine.score<theirs.score?'l':'d';cls='res-'+w;t=(w==='w'?tx('Gewonnen'):w==='l'?tx('Verloren'):tx('Gelijk'))+' '+mine.score+' – '+theirs.score;}
      const s=el('small',cls,t);
      const act=!mine&&d.from===NET.me?btn('mini go',tx('Speel'),()=>playDuel(d)):(o&&mine&&theirs?btn('mini',tx('Revanche'),()=>challenge(o)):null);
      l.append(drow(o?tx('tegen {x}',{x:nickOf(o)}):tx('Willekeurig duel'),s,act));});
    nodes.push(l);}
  box.replaceChildren(...nodes);
}
function drow(title,sub,action){const r=el('div','drow'),t=el('div','t');t.append(el('b',null,title));
  if(sub)t.append(typeof sub==='string'?el('small',null,sub):sub);r.append(t);if(action)r.append(action);return r;}
async function findRandom(){
  if(!(await ensureNick()))return;
  showCard([el('h2',null,tx('Tegenstander zoeken…')),el('p',null,tx('Even geduld.'))]);
  try{
    // The server pairs us with the oldest open duel someone already played, or opens a new one.
    const d=toDuel(await API.call('gq_duel_random'));
    NET.duels=[d,...NET.duels.filter(x=>x.id!==d.id)];
    closeCard();playDuel(d);
  }catch(e){showCard([el('h2',null,tx('Zoeken lukte niet')),el('p',null,tx('Controleer je verbinding en probeer opnieuw.')),btn('primary','OK',closeCard)]);}
}
async function challenge(fid){
  if(!(await ensureNick()))return;
  try{
    const x=await API.call('gq_duel_challenge',{p_friend:fid});
    if(!x||!x.id)throw new Error(x&&x.status||'refused');
    const d=toDuel(x);NET.duels=[d,...NET.duels];playDuel(d);
  }catch(e){toast(tx('Uitdagen lukte niet.'));}
}
function playDuel(d){
  if(myRes(d))return;
  const o=oppOf(d),g=o&&d.r&&d.r[o];
  audio();
  newGame({mode:'duel',seed:d.seed,duel:{id:d.id,opp:o,oppName:o?nickOf(o):'',ghost:g?g.prog:null,oppScore:g?g.score:null}});
  hud();
}
function duelUpdate(d){
  const o=oppOf(d),g=o&&d.r&&d.r[o];
  S.duel.opp=o;S.duel.oppName=o?nickOf(o):'';
  if(g){S.duel.ghost=g.prog;S.duel.oppScore=g.score;}
  if(S.over&&!ov.hidden&&card.dataset.duel===d.id)duelCard();else if(!S.over)hud();
}
function duelEnd(){
  sfx.over();
  if(online()&&S.duel.id){const id=S.duel.id,score=S.score,prog=S.prog.slice(0,DUEL_MOVES).map(x=>Math.round(x));
    write(()=>API.call('gq_duel_submit',{p_duel:id,p_score:score,p_prog:prog}).then(()=>refreshDuels()));}
  duelCard();
}
function duelCard(){
  const d=S.duel,op=d.oppScore,nodes=[];
  let title=tx('Score ingediend');
  if(op!=null){title=S.score>op?tx('Gewonnen!'):S.score<op?tx('Verloren'):tx('Gelijkspel');}
  nodes.push(el('h2',null,title));
  const grid=el('div','duelres'),a=el('div'),b=el('div');
  a.append(el('div','n',String(S.score)),el('div',null,tx('Jij')));
  b.append(el('div','n',op==null?'?':String(op)),el('div',null,d.oppName||tx('Tegenstander')));
  grid.append(a,el('div',null,'–'),b);nodes.push(grid);
  if(op==null)nodes.push(el('p',null,d.opp?tx('{x} speelt dezelfde blokken later. Je ziet de uitslag in Multiplayer.',{x:d.oppName}):tx('Zodra iemand je duel oppikt, zie je de uitslag in Multiplayer.')));
  if(op!=null&&S.score>op){confetti(140);sfx.cheer(3);}
  if(d.opp&&op!=null)nodes.push(btn('primary',tx('Revanche'),()=>{closeCard();afterGame(()=>challenge(d.opp));}));
  nodes.push(btn(op==null&&!d.opp?'primary':'secondary',tx('Nog een duel'),()=>{closeCard();afterGame(findRandom);}));
  nodes.push(btn('secondary',tx('Menu'),()=>{closeCard();afterGame(()=>show('mp'));}));
  showCard(nodes);card.dataset.duel=d.id;
}

/* ---------- leaderboards ---------- */
let lbTab='world', lbReq=0;
['world','week','friends'].forEach(t=>$('t-'+t).onclick=()=>{lbTab=t;openLB(t);});
function closeLB(){lbReq++;}
async function openLB(tab){
  closeLB();const req=lbReq;['world','week','friends'].forEach(t=>$('t-'+t).setAttribute('aria-selected',t===tab));
  const box=$('lb-body');
  if(!online())return offlineNote(box);
  box.replaceChildren(el('div','empty',tx('Laden…')));
  try{
    if(tab==='friends')await refreshFriends();
    const r=await API.call('gq_leaderboard',{p_scope:tab,p_limit:50});
    if(req!==lbReq)return;
    const idOf=n=>(NET.friends.find(f=>f.nickname===n)||{}).id||null;
    const rows=(r.top||[]).map(x=>({uid:x.me?NET.me:idOf(x.nickname),nick:x.nickname,score:x.score,rank:x.rank,friend:!!x.friend}));
    if(r.me&&!rows.some(x=>x.uid===NET.me))rows.push({uid:NET.me,nick:r.me.nickname,score:r.me.score,rank:r.me.rank});
    renderLB(tab,rows);
  }catch(e){if(req===lbReq)box.replaceChildren(el('div','empty',tab==='friends'?tx('Je vrienden konden niet laden.'):tx('Het klassement kon niet laden.')));}
}
/* Google Play listing: replace PLAY_ID with the real package name once the app is published */
const PLAY_ID='be.proqltc.gridquake';
const playLink=code=>'https://play.google.com/store/apps/details?id='+PLAY_ID+'&referrer='+encodeURIComponent('utm_source=invite&code='+code);
const inviteText=code=>tx('Speel Gridquake met mij! 🧱 Download de app: {x}',{x:playLink(code)})+'\n'+tx('Voeg me toe als vriend met mijn code: {x}',{x:code});
function inviteCard(code){
  const msg=inviteText(code),ta=el('textarea');ta.id='invite-msg';ta.readOnly=true;ta.value=msg;ta.rows=5;
  ta.style.cssText='font:inherit;font-size:14px;width:100%;box-sizing:border-box;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:none';
  const copy=btn('primary',tx('Kopieer uitnodiging'),async()=>{
    try{await navigator.clipboard.writeText(msg);copy.textContent=tx('Gekopieerd ✓');}
    catch(e){ta.focus();ta.select();copy.textContent=tx('Selecteer en kopieer de tekst');}});
  const nodes=[el('h2',null,tx('Nodig een vriend uit')),el('p',null,tx('Je vriend krijgt de link naar Gridquake in de app-winkel en jouw vriendcode {x}.',{x:code})),ta];
  if(navigator.share)nodes.push(btn('primary',tx('Delen…'),()=>navigator.share({title:'Gridquake',text:msg}).catch(()=>{})));
  nodes.push(copy,btn('secondary',tx('Sluiten'),closeCard));
  showCard(nodes);
}
function renderLB(tab,rows){
  const box=$('lb-body'),nodes=[];
  if(tab==='week')nodes.push(el('p','muted',tx('Week {n}. Begint elke maandag opnieuw.',{n:weekKey().split('-W')[1]})));
  if(!NET.player)nodes.push(btn('secondary',tx('Kies een spelersnaam om mee te doen'),()=>ensureNick().then(()=>openLB(tab))));
  if(!rows.length)nodes.push(el('div','empty',tab==='friends'?tx('Voeg vrienden toe met hun code hieronder.'):tx('Nog geen scores. Speel Klassiek en zet de eerste!')));
  const l=el('div','list');
  rows.forEach(p=>{
    const r=el('div','row'+(p.uid===NET.me?' you':'')),k=p.rank;
    r.append(el('span','rank'+(k<=3?' g'+k:''),String(k)),el('span','nm',p.uid===NET.me?p.nick+' ('+tx('jij')+')':p.nick),el('span','pts',String(p.score||0)));
    if(tab==='friends'&&p.uid&&p.uid!==NET.me)r.append(btn('mini',tx('Uitdagen'),()=>challenge(p.uid)));
    else r.append(el('span',p.friend?'muted':null,p.friend?tx('vriend'):''));
    l.append(r);});
  nodes.push(l);
  if(NET.player&&tab==='friends'){
    nodes.push(el('h2','sec',tx('Vrienden')));
    const cb=el('div','codebox');cb.append(el('span','muted',tx('Jouw vriendcode')),el('span','code',NET.player.code||'–'));nodes.push(cb);
    nodes.push(btn('primary','📨 '+tx('Nodig een vriend uit'),()=>inviteCard(NET.player.code||'')));
    const add=el('div','codebox'),inp=el('input');inp.type='text';inp.id='fcode';inp.maxLength=6;inp.placeholder=tx('Code van je vriend');inp.setAttribute('aria-label',tx('Vriendcode'));
    const go=btn('mini go',tx('Toevoegen'),async()=>{
      const c=inp.value.trim().toUpperCase();if(c.length!==6)return;
      try{const r=await API.call('gq_add_friend',{p_code:c});
        if(r.status==='unknown'||r.status==='self'){inp.value='';inp.placeholder=tx('Code niet gevonden');return;}
        if(r.status!=='added'&&r.status!=='already'){inp.value='';inp.placeholder=tx('Probeer opnieuw');return;}
        inp.value='';openLB('friends');
      }catch(e){inp.placeholder=tx('Probeer opnieuw');}});
    add.append(inp,go);nodes.push(add);
  }
  box.replaceChildren(...nodes);
}

/* ---------- settings ---------- */
function settingsCard(){
  const h=t=>el('h3','set-h',t);
  const codeEl=el('span','code','…'),cp=btn('mini',tx('Kopieer'),async()=>{
    try{await navigator.clipboard.writeText(codeEl.textContent);cp.textContent=tx('Gekopieerd ✓');}
    catch(e){const r=document.createRange();r.selectNodeContents(codeEl);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}});
  const cbox=el('div','codebox');cbox.append(codeEl,cp);
  const rin=el('input');rin.type='text';rin.id='rcode';rin.maxLength=14;rin.autocomplete='off';rin.placeholder='XXXX-XXXX-XXXX';rin.setAttribute('aria-label',tx('Herstelcode ingeven'));
  const rmsg=el('p','note',''),rgo=btn('mini go',tx('Herstellen'),()=>restoreFlow(rin.value,rmsg));
  const rrow=el('div','codebox');rrow.append(rin,rgo);
  showCard([el('h2',null,tx('Instellingen')),
    h(tx('Taal')),langRow(settingsCard),
    h(tx('Gebruikersnaam')),el('p','set-v',NET.player?.nick||store.get('blockers-nick')||'–'),
    h(tx('Herstelcode')),el('p','note',tx('Bewaar deze code. Op een nieuw toestel zet je er je account mee terug.')),cbox,
    h(tx('Herstelcode ingeven')),rrow,rmsg,
    ...(ADS.privacy?[btn('secondary',tx('Privacy-instellingen reclame'),()=>ADS.plugin.showPrivacyOptionsForm().catch(()=>{}))]:[]),
    btn('danger',tx('Gebruikersnaam en gegevens verwijderen'),deleteFlow),
    btn('secondary',tx('Sluiten'),closeCard)]);
  if(!online()){codeEl.textContent=tx('Herstelcode niet beschikbaar.');cp.hidden=true;rgo.disabled=true;}
  else getRecovery().then(c=>{codeEl.textContent=c||tx('Herstelcode niet beschikbaar.');if(!c)cp.hidden=true;});
}
async function restoreFlow(raw,msg){
  const c=normCode(raw);msg.classList.add('err');
  if(c.length!==12){msg.textContent=tx('Code niet gevonden');return;}
  if(!online()){msg.textContent=tx('Herstelcode niet beschikbaar.');return;}
  const pretty=c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8);
  showCard([el('h2',null,tx('Account herstellen?')),el('p',null,tx('De gegevens op dit toestel worden vervangen door die van {x}.',{x:pretty})),
    btn('primary',tx('Herstellen'),async()=>{
      const fail=t=>showCard([el('h2',null,tx('Account herstellen?')),el('p','note err',t),btn('secondary',tx('Sluiten'),settingsCard)]);
      try{
        const r=await API.call('gq_restore',{p_code:c});
        if(r.status==='unknown')return fail(tx('Code niet gevonden'));
        if(r.status==='self')return fail(tx('Dit is je huidige account.'));
        if(r.status!=='restored')return fail(tx('Probeer opnieuw'));
        setProfile(r.profile);
        CAMP={s:{...(NET.player?.camp||{})},b:{}};store.set(CAMPKEY,JSON.stringify(CAMP));store.set('blockers-best',NET.player?.best||0);
        store.set('blockers-wk-'+weekKey(),NET.player?.weekBest||0);
        await refreshFriends();await refreshDuels();
        renderMenu();showCard([el('h2',null,tx('Account hersteld')),el('p',null,NET.player?.nick||''),btn('primary',tx('Sluiten'),closeCard)]);
      }catch(e){console.warn(e);fail(tx('Probeer opnieuw'));}
    }),
    btn('secondary',tx('Annuleren'),settingsCard)]);
}
function deleteFlow(){
  showCard([el('h2',null,tx('Alles verwijderen?')),el('p',null,tx('Je gebruikersnaam, scores, sterren en vrienden worden definitief gewist. Dit kan niet ongedaan worden.')),
    btn('danger solid',tx('Verwijderen'),async()=>{
      if(online()){try{await API.call('gq_delete_me');}catch(e){console.warn(e);}}
      try{Object.keys(localStorage).filter(k=>k.startsWith('blockers-')).forEach(k=>localStorage.removeItem(k));}catch(e){}
      location.reload();}),
    btn('secondary',tx('Annuleren'),settingsCard)]);
}
$('settings').onclick=settingsCard;

/* ---------- first start: language, then username ---------- */
let langChosen=false;
async function onboarding(){
  if(!langChosen&&!store.get('blockers-lang')){showCard([el('h2',null,tx('Kies je taal')),langRow(()=>{langChosen=true;closeCard();onboarding();})]);return;}
  await Promise.race([NET.ready,new Promise(r=>setTimeout(r,8000))]);
  if(NET.db)await Promise.race([NET.pReady,new Promise(r=>setTimeout(r,6000))]);
  renderMenu();
  if(NET.player&&NET.player.nick)return initAds();
  if(!NET.db&&store.get('blockers-nick'))return initAds();
  nameCard(()=>initAds(),false);
}
applyStatic();

renderMenu();requestAnimationFrame(frame);
onboarding();
})();
