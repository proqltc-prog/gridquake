<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f6fd">
<title>Gridquake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone arcade — logo bar, then one of four screens (menu, game, duels, ranking) */
:root{
  --bg:#f1f6fd; --glowA:#d3eaff; --glowB:#ffe0eb; --panel:#ffffff; --panel2:#ffffff; --surface:#ffffff; --soft:#e8eef7; --line:#d6deec;
  --fg:#2a2550; --muted:#6a6790; --accent:#ffb020; --accentText:#e07c00; --hot:#ff4f73; --cool:#22a6ee; --good:#16a35b; --ink:#3a2600;
  --lift:0 4px 0 #d4dcea, 0 8px 20px rgba(60,75,130,.08);
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;color:var(--fg);font-family:var(--body);
  background:radial-gradient(120% 60% at 10% 0%,var(--glowA) 0,transparent 55%),radial-gradient(90% 50% at 100% 100%,var(--glowB) 0,transparent 55%),var(--bg);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff3c4 0,var(--accent) 45%,#ff8a3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #c45a17)}
.hbtns{display:flex;gap:6px}
button{font:inherit;cursor:pointer;color:inherit}
.pill{background:var(--surface);box-shadow:0 2px 0 #d4dcea;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;min-width:38px}
.screen{display:flex;flex-direction:column;gap:10px}
h2.sec{font-family:var(--display);font-weight:400;font-size:18px;margin:6px 0 0;color:var(--fg)}
.muted{color:var(--muted);margin:0;font-size:14px;line-height:1.4}

/* menu */
.menu{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--lift)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d4dcea}
.mbtn b{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--fg)}
.mbtn span{color:var(--muted);font-size:13px;font-weight:700}
.mbtn .txt{min-width:0;flex:1}
.ico{flex:none;width:46px;height:46px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.ico i{border-radius:5px;background:var(--c)}
.badge{flex:none;background:var(--hot);color:#fff;font-weight:900;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.me{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.me b{font-variant-numeric:tabular-nums}
.me .nickbtn{padding:0;font-size:14px}
.me .who{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.me small{color:var(--muted);font-weight:700}
.me .md{margin-left:8px;font-weight:800;white-space:nowrap}
.mapcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--wc);border-radius:16px;padding:10px 12px;margin-top:8px;cursor:pointer;
  background:linear-gradient(120deg,var(--bgA),var(--bgB));color:var(--fg);font:inherit;box-shadow:0 4px 0 color-mix(in srgb,var(--wc) 45%,transparent)}
.mapcard .mt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.mapcard .mt b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--fg)}
.mapcard .mt span{font-size:13px;font-weight:700;color:var(--muted)}
.mapcard .medals{display:flex;gap:2px;font-size:18px}
.mapcard .medals span{filter:grayscale(1);opacity:.3}.mapcard .medals span.on{filter:none;opacity:1}
.mapcard.locked{filter:grayscale(.85);opacity:.6;cursor:default}
.mapcard .lk{font-size:18px}
.mapgoals{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mg{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700}
.mg .mge{font-size:18px;filter:grayscale(1);opacity:.45}.mg.done .mge{filter:none;opacity:1}
.mg .mtx{flex:1}.mg .mp{font-variant-numeric:tabular-nums;color:var(--muted)}.mg.done .mp{color:#1f9d55}
.node.final{width:82px;height:82px;box-shadow:0 0 0 4px #ffd84d,0 5px 0 rgba(0,0,0,.16)}
.obbox{display:flex;gap:10px;align-items:flex-start}.obbox canvas{flex:none}
.card .sec2{font-weight:800;margin:4px 0 -4px;color:var(--fg)}
.card .tip{font-size:13px;color:#8a5a00;background:#fff6dc;border-radius:10px;padding:8px 10px;margin:0;text-align:left}
.goal.warn{border-color:#ffb199}.goal.hot{background:#ffe4dc;animation:nodepulse 1s ease-in-out infinite}
.medalwin{display:flex;justify-content:center;gap:10px;font-size:54px;line-height:1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-weight:700;text-align:left}
.switch{position:relative;flex:none;width:50px;height:30px;border-radius:99px;border:0;padding:0;background:var(--line);transition:background .2s}
.switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--good)}.switch.on .knob{transform:translateX(20px)}
.switch:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;padding:9px 6px;background:transparent;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
:root[data-theme=dark]{--bg:#151a2e;--glowA:#26305a;--glowB:#3a2440;--panel:#1f2640;--panel2:#1f2640;--surface:#222a45;--soft:#2b3354;--line:#38426a;
  --fg:#eef1ff;--muted:#a8b0d6;--lift:0 4px 0 #0e1222,0 8px 20px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme=dark] .pill{box-shadow:0 2px 0 #0e1222}
:root[data-theme=dark] .mbtn:active{box-shadow:0 1px 0 #0e1222}
:root[data-theme=dark] .mbtn.hero{border-color:#ffb020;background:linear-gradient(180deg,#2e2a3e,var(--surface))}
:root[data-theme=dark] .tipbox{background:#1f3352;border-color:#30507a;color:#cfe6ff}
:root[data-theme=dark] .card .tip{background:#3a3020;color:#ffdca0}
:root[data-theme=dark] .warn{background:#3a2e1c;border-color:#6a5124;color:#ffdca0}
:root[data-theme=dark] .row.you{background:#3a3220;border-color:#7a6224}
:root[data-theme=dark] .goal.hot{background:#4a2420}
:root[data-theme=dark] .mapcard{background:var(--surface);box-shadow:0 4px 0 #0e1222}
:root[data-theme=dark] .node.locked{box-shadow:0 4px 0 #0e1222}
:root[data-theme=dark] .card{box-shadow:0 20px 50px rgba(0,0,0,.5)}
.tutbox{display:flex;flex-direction:column;gap:3px;background:#fff3c4;border:2px solid #ffc94d;border-radius:14px;padding:9px 12px;color:#5a3d00;text-align:left}
.tutbox b{font-family:var(--display);font-weight:400;font-size:14px;color:#c46a00}
.tutbox span{font-size:15px;font-weight:700;line-height:1.35}
:root[data-theme=dark] .tutbox{background:#3a3020;border-color:#8a6a1c;color:#ffe6b8}:root[data-theme=dark] .tutbox b{color:#ffb020}
.guideimg{display:flex;justify-content:center;margin:4px 0}
.gtext{margin:0;font-size:15px;line-height:1.4;color:var(--fg)!important}
.glist{display:flex;flex-direction:column;gap:7px;text-align:left}
.gl2{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:6px 10px}
.gl2 canvas,.gl2 .ge{flex:none;width:32px;height:32px;font-size:26px;line-height:32px;text-align:center}
.gl2 div{display:flex;flex-direction:column;gap:1px}.gl2 b{font-size:15px;color:var(--fg)}.gl2 div span{font-size:13px;line-height:1.35;color:var(--muted)}
@media (max-height:620px){.card{padding:16px;gap:8px}.card h2{font-size:22px}.gl2 div span{font-size:12.5px}.glist{gap:5px}.gl2{padding:5px 10px}}
.dots{display:flex;justify-content:center;gap:6px}.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--accent)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:900;font-size:16px;box-shadow:0 3px 0 #d4dcea}
.gbtn svg{flex:none}
.warn{background:#fff4e0;border:1px solid #ffd79a;border-radius:12px;padding:10px 12px;color:#7a4b00;font-size:13px;line-height:1.4;text-align:left}
.note{font-size:13px;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;color:var(--accentText);font-weight:800;padding:4px}

/* game */
.gtop{display:flex;align-items:center;gap:8px}
.hud{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;flex:1}
.stat{background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 #dfe5f0;border-radius:14px;padding:6px 12px;min-width:0}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900}
.stat b{display:block;font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums;line-height:1.15}
#score{font-size:30px;transform-origin:left center;
  background:linear-gradient(180deg,#ffd23f 0,#ffa51f 55%,#ff7a1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #b9520f)}
#side{font-size:22px;margin-top:4px}
#side.low{color:var(--hot)}
#score.bump{animation:bump .42s cubic-bezier(.3,1.9,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.32) rotate(-3deg)}100%{transform:scale(1)}}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--hot);color:#fff;font-size:10px;letter-spacing:.08em;vertical-align:middle}
.meter{display:flex;align-items:center;gap:8px;font-weight:900;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#ff8a3d,var(--hot));transition:width .25s}
#combo{min-width:52px;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.vs .who{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tug{height:10px;border-radius:99px;background:var(--hot);overflow:hidden}
.tug div{height:100%;width:50%;background:var(--cool);transition:width .4s}
canvas{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{margin:0 auto;border-radius:24px}
#cv.lastmove{animation:lastmove 1s ease-in-out infinite}
@keyframes lastmove{50%{box-shadow:0 0 0 3px #ff4f73,0 0 26px rgba(255,79,115,.7)}}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0;text-wrap:balance}

/* lists */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:900;padding:8px;border-radius:10px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:28px}
.row.you{background:#fff5d9;border-color:#ffd27a}
.rank{font-family:var(--display);font-size:15px;text-align:center;color:var(--muted)}
.rank.g1{color:#f2a900}.rank.g2{color:#8f99b0}.rank.g3{color:#e0773a}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.pts{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:15px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 9px;font-weight:900;font-size:13px}
.mini.go{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.drow .t{min-width:0}
.drow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow small{color:var(--muted);font-weight:700}
.res-w{color:var(--good)}.res-l{color:var(--hot)}.res-d{color:var(--accentText)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);text-align:center;font-size:14px}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--display);letter-spacing:.12em;font-size:18px;color:var(--accentText)}
input[type=text]{font:inherit;font-weight:800;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;flex:1}

.overlay{position:fixed;inset:0;background:rgba(42,48,90,.35);backdrop-filter:blur(5px);display:grid;place-items:center;padding:24px;z-index:20}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 50px rgba(40,50,100,.2);border-radius:20px;padding:22px;max-width:340px;width:100%;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.card h2{font-family:var(--display);font-weight:400;margin:0;font-size:26px;color:var(--accentText);text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.card ul{margin:0;padding:0;list-style:none;text-align:left;display:flex;flex-direction:column;gap:9px}
.card li{display:flex;gap:10px;align-items:flex-start;line-height:1.35;font-size:14px}
.card li canvas{flex:none;width:26px;height:26px}
.big{font-family:var(--display);font-size:50px;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#ffd23f,#ffa51f 55%,#ff7a1a);filter:drop-shadow(0 3px 0 #b9520f);-webkit-background-clip:text;background-clip:text;color:transparent}
.duelres{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-weight:900}
.duelres div{min-width:0;overflow:hidden;text-overflow:ellipsis}
.duelres .n{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.primary{background:linear-gradient(180deg,#ffd970,var(--accent));color:var(--ink);border:0;border-radius:14px;padding:13px;font-weight:900;font-size:16px;box-shadow:0 4px 0 #b07a12}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #b07a12}
.primary:disabled{opacity:.5}
.secondary{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:800}
.adbox{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:28px 12px;color:var(--muted);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
/* campaign */
.langrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill.gear{display:grid;place-items:center;padding:6px 10px}
.card{max-height:calc(100vh - 48px);overflow-y:auto}
.acc{flex:none;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;text-align:left}
.acc+.acc{margin-top:8px}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:12px 12px;font-weight:800;font-size:15px;color:var(--fg);text-align:left}
.acc-h .ai{flex:none;font-size:18px;width:22px;text-align:center}.acc-h .at{flex:0 1 auto;min-width:min-content}
.acc-h .v{margin-left:auto;flex:1 1 0;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:700;font-size:13px}
.acc-h .chev{flex:none;color:var(--muted);font-size:20px;line-height:1;transition:transform .2s}
.acc-h .v.short{flex:none}.acc.open .acc-h .chev{transform:rotate(90deg)}.acc.open{border-color:var(--accent)}
.acc-h:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.acc-b{display:flex;flex-direction:column;gap:8px;padding:0 12px 14px}
.acc-b .danger{font-size:14px;padding:10px 8px;line-height:1.25}
.set-h{font-family:var(--display);font-weight:400;font-size:15px;margin:6px 0 0;text-align:left;color:var(--fg)}
.set-v{margin:0;text-align:left;font-weight:800;color:var(--fg)!important}
.card .note{font-size:13px;text-align:left}
.card .note.err{color:var(--hot)}
.danger{background:transparent;color:var(--hot);border:1px solid #f6b3c0;border-radius:14px;padding:12px;font-weight:800}
.danger.solid{background:var(--hot);color:#fff;border-color:var(--hot)}
#rcode{text-transform:uppercase;letter-spacing:.08em}
.langbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:800}
.langbtn.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.mbtn.hero{border:2px solid #ffc061;background:linear-gradient(180deg,#fffaf0,#fff)}
.mbtn.play{padding:20px 16px}.mbtn.play b{font-size:26px}
.playico{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--ink)!important;
  background:linear-gradient(180deg,#ffd970,var(--accent));box-shadow:0 4px 0 #b07a12;padding-left:4px;box-sizing:border-box}
.wallet{display:flex;align-items:center;gap:8px}
.big.coinbig{font-size:32px;margin:0}
.coinline{font-weight:900;color:#b7791f;margin:0}
.coins{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.wallet .spacer{flex:1}
.adbtn{font-variant-numeric:tabular-nums;color:var(--muted)}
.adbtn.ready{background:linear-gradient(180deg,#ffd970,var(--accent));color:var(--ink);border-color:#e0a526;animation:adpulse 1.6s ease-in-out infinite}
@keyframes adpulse{50%{transform:scale(1.06)}}
.adbtn:disabled{opacity:.75}
.wbtn{position:relative;color:var(--fg)}
.wbtn .dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--hot);border:2px solid var(--bg)}
/* the helpers stand in a column to the right of the board, one button per helper */
.playrow{display:flex;justify-content:center;align-items:flex-start;gap:6px}
.playrow #cv{margin:0;flex:none}
.tools{display:flex;flex-direction:column;gap:6px;flex:none;width:58px}
.tool{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);box-shadow:0 3px 0 #d4dcea;font-weight:800;font-size:12px;color:var(--muted)}
.tool .ti{font-size:21px;line-height:1}
.tool .tl{font-size:10px;line-height:1.1;text-align:center}
.tool .tn{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:var(--ink);font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px;box-sizing:border-box}
.tool.empty,.tool:disabled{opacity:.45;filter:grayscale(.8);cursor:default}.tool.empty .tn{background:var(--soft);color:var(--muted)}
.tool.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}

.movesline{font-family:var(--display);color:var(--fg)!important;font-size:18px}
.campstars{margin-left:auto;font-family:var(--display);color:var(--accentText);font-size:16px}
.camp{display:flex;flex-direction:column;gap:4px}

.node{transform:translateX(var(--x));width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55) 0,transparent 42%),var(--wc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.16),0 8px 16px rgba(40,50,100,.12);padding:0}

.node .num{font-family:var(--display);font-size:20px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.22)}

.node .stars .on{color:#fff3a6;text-shadow:0 1px 0 #b36b00}

.node.locked .num{text-shadow:none;font-size:18px}
.node .lk{font-size:10px;line-height:1;margin-top:2px}

.stars-big,.stars-mid{display:flex;justify-content:center;gap:6px;font-size:44px;line-height:1;color:#e3e8f1}
.stars-mid{font-size:26px}
.stars-big .on,.stars-mid .on{color:#ffb020;text-shadow:0 3px 0 #c46a00}
.stars-big .popin{animation:starpop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
@media (prefers-reduced-motion: reduce){#score.bump,.card,.node.cur,.stars-big .popin{animation:none}}

d twice.","Een tijdbom telt bij elke zet één af. Wis hem met een lijn voor hij op 0 staat, anders ontploft het level.":"A time bomb counts down by one with every move. Clear it with a line before it reaches 0, or the level blows up.","Een vakje onder een blok in een andere kleur blijft leeg tot je die lijn wist.":"A square under a block of another colour stays unpainted until you clear that line.","Eindbaas":"Boss","Eindbaas verslagen!":"Boss defeated!","Explosies breken kettingen ook.":"Explosions break chains too.","Eén lijn door twee kisten opent ze allebei, als je genoeg sleutels hebt.":"One line through two chests opens both, if you have enough keys.","Geluid en trillen":"Sound and vibration","Geluidseffecten":"Sound effects","Geschilderd!":"Painted!","Haal 3 sterren op de eindbaas":"Get 3 stars on the boss","Het bord heeft gaten met water. Een rij of kolom is al vol als alle vakjes met land gevuld zijn.":"The board has holes with water. A row or column is full as soon as all land squares are filled.","Het getal boven het bord toont wanneer de volgende lavarij komt.":"The number above the board shows when the next lava row comes.","Hou de bovenste rijen leeg: daar duwt de lava naartoe.":"Keep the top rows empty: that is where the lava pushes to.","Hou plaats vrij: stenen vallen alleen op lege vakjes.":"Keep space free: stones only fall on empty squares.","IJs onder een blok breekt pas als dat blok wordt gewist.":"Ice under a block only breaks when that block is cleared.","Kijk eerst naar de bom met het laagste getal.":"Look at the bomb with the lowest number first.","Kijk eerst welk obstakel het gevaarlijkst is.":"First see which obstacle is the most dangerous.","Kist open!":"Chest open!","Korte rijen naast het water zijn snel vol.":"Short rows next to the water fill up fast.","Lange blokken passen niet overal: kijk goed naar de vorm van het eiland.":"Long blocks don't fit everywhere: look closely at the shape of the island.","Lava afgekoeld!":"Lava cooled down!","Lava stijgt!":"Lava rising!","Leg een blok in dezelfde kleur op een gekleurd vakje om het te schilderen. Schilder ze allemaal.":"Place a block of the same colour on a coloured square to paint it. Paint them all.","Mos groeit alleen naar lege vakjes: leg blokken ernaast om het in te sluiten.":"Moss only grows into empty squares: place blocks next to it to box it in.","Naar {x}":"To {x}","Nieuwe kaart open: {x}!":"New map open: {x}!","Nieuwe medaille!":"New medal!","Nieuwe medailles!":"New medals!","Nieuwe tijdbommen landen op lege vakjes: hou het bord netjes.":"New time bombs land on empty squares: keep the board tidy.","Om de paar beurten schuift er onderaan een rij lava in en duwt alles omhoog. Blokken bovenaan vallen van het bord. Raakt de lava de bovenkant, dan verlies je.":"Every few turns a row of lava slides in at the bottom and pushes everything up. Blocks at the top fall off the board. If the lava reaches the top, you lose.","Om de {n} beurten komt er een lavarij bij.":"Every {n} turns a lava row is added.","Om de {n} beurten landt er een nieuwe tijdbom.":"Every {n} turns a new time bomb lands.","Om de {n} beurten valt er een steen.":"Every {n} turns a stone falls.","Ontmantel {n} tijdbom":"Defuse {n} time bomb","Ontmantel {n} tijdbommen":"Defuse {n} time bombs","Ontmanteld!":"Defused!","Open alle {n} kisten":"Open all {n} chests","Open {n} kisten":"Open {n} chests","Raap eerst sleutels op, open daarna de kisten.":"Pick up keys first, then open the chests.","Rijen en kolommen met veel water geven snelle punten.":"Rows and columns with lots of water give quick points.","Ruim mos snel op, het groeit sneller dan je denkt.":"Clear moss quickly, it grows faster than you think.","Ruim {n} mosvakjes op":"Clear {n} moss squares","Schatgrot":"Treasure Cave","Schilder alle {n} gekleurde vakjes":"Paint all {n} coloured squares","Schilder {n} vakjes":"Paint {n} squares","Schildersatelier":"Painter's Studio","Sleutel nodig!":"Key needed!","Sleutel!":"Key!","Sleutels":"Keys","Sleutels zitten soms in de blokken onderaan: leg ze slim.":"Keys are sometimes in the blocks below the board: place them wisely.","Spaar power-blokken voor de moeilijkste plek.":"Save power blocks for the hardest spot.","Stenen vallen om de paar beurten op het bord. Het getal toont hoeveel keer een lijn of explosie hem nog moet raken.":"Stones fall onto the board every few turns. The number shows how many more times a line or explosion has to hit it.","Tijdbom!":"Time bomb!","Tijdbommen en lava eerst, de rest daarna.":"Time bombs and lava first, the rest after that.","Tip: {x}":"Tip: {x}","Trillen":"Vibration","Verder":"Continue","Verdien {n} sterren op deze kaart":"Earn {n} stars on this map","Versla de eindbaas van {x} om deze kaart te openen.":"Beat the boss of {x} to open this map.","Vul het gat in een lavarij om hem te wissen.":"Fill the gap in a lava row to clear it.","Vulkaan":"Volcano","Werk van buiten naar binnen: hoekijs is het lastigst.":"Work from the outside in: corner ice is the hardest.","Win alle {n} levels":"Win all {n} levels","Wis een sleutel met een lijn om hem op te rapen. Een lijn door een kist opent hem als je een sleutel hebt.":"Clear a key with a line to pick it up. A line through a chest opens it if you have a key.","Wis {n} lavablokken":"Clear {n} lava blocks","Wis {n} lijnen":"Clear {n} lines","Wis {n} lijnen op de eilanden":"Clear {n} lines on the islands","Zandwoestijn":"Sand Desert","Zetten tot de volgende lavarij":"Moves until the next lava row","vergrendeld":"locked","{n} blokken van het bord geduwd":"{n} blocks pushed off the board","Thema":"Theme","Light":"Light","Dark":"Dark","Privacy":"Privacy","5 korte oefeningen: blokken leggen, lijnen wissen en power-blokken maken.":"5 short exercises: placing blocks, clearing lines and making power blocks.","Blokken leggen":"Placing blocks","Een Bom":"A Bomb","Een Prisma":"A Prism","Een Raket gebruiken":"Using a Rocket","Een Raket maken":"Making a Rocket","Een rij en een kolom tegelijk vol geeft ook een Raket.":"A row and a column full at the same time also give a Rocket.","Gehaald":"Done","Hoe werkt het spel?":"How does the game work?","Je kent nu alle basisregels. Kaart 1 van de campagne staat open!":"You now know all the basic rules. Map 1 of the campaign is open!","Laat een Raket ontploffen.":"Make a Rocket explode.","Leg het blok op de oplichtende vakjes.":"Place the block on the glowing squares.","Maak 2 rijen tegelijk vol. Zo maak je een Raket.":"Fill 2 rows at once. That is how you make a Rocket.","Maak 3 rijen tegelijk vol. Zo maak je een Bom.":"Fill 3 rows at once. That is how you make a Bomb.","Maak een rij vol met blokken in één kleur. Zo maak je een Prisma.":"Fill a row with blocks of one colour. That is how you make a Prism.","Maak rijen en kolommen vol.":"Fill rows and columns.","Neem de Bom mee in een volle rij. Hij blaast alles rondom weg.":"Take the Bomb along in a full row. It blasts away everything around it.","Neem de Raket mee in een volle rij. Hij ontploft over zijn hele rij en kolom.":"Take the Rocket along in a full row. It explodes across its whole row and column.","Neem het Prisma mee in een volle rij. Het wist alle blokken in zijn kleur.":"Take the Prism along in a full row. It clears all blocks of its colour.","Oefening":"Exercise","Oefening {n} gehaald!":"Exercise {n} done!","Oefening {n}: {x}":"Exercise {n}: {x}","Oefenkaart":"Practice map","Ook een volle kolom verdwijnt. Leg het blok onderaan in de kolom.":"A full column disappears too. Place the block at the bottom of the column.","Overslaan":"Skip","Raakt een ontploffing een ander power-blok, dan krijg je een kettingreactie met dubbele punten.":"If an explosion hits another power block, you get a chain reaction with double points.","Sleep het blok naar de oplichtende vakjes. Een volle rij verdwijnt en geeft punten.":"Drag the block to the glowing squares. A full row disappears and scores points.","Speel eerst de oefenkaart.":"Play the practice map first.","Volgende oefening":"Next exercise","Wis 2 lijnen tegelijk.":"Clear 2 lines at once.","Wis 3 lijnen tegelijk.":"Clear 3 lines at once.","Wis een lijn in één kleur.":"Clear a line in one colour.","{n} van {m} oefeningen":"{n} of {m} exercises","Spelsoorten":"Game modes","Leg je blokken":"Place your blocks","Sleep een blok naar het bord.":"Drag a block onto the board.","Je krijgt er telkens drie. Zijn ze alle drie gelegd? Dan krijg je er drie nieuwe.":"You always get three. Placed all three? Then three new ones arrive.","Maak lijnen vol":"Fill lines","Vul een rij of kolom helemaal. Die verdwijnt en je scoort punten.":"Fill a row or column completely. It disappears and you score points.","Wis je meerdere lijnen tegelijk, dan stijgen je punten snel.":"Clear several lines at once and your points climb fast.","Neem een power-blok mee in een volle lijn en het ontploft. Twee power-blokken naast elkaar ontploffen samen in een Power-combo. Niet in Klassiek.":"Take a power block along in a full line and it explodes. Two power blocks side by side go off together in a Power combo. Not in Classic.","2 lijnen tegelijk. Ontploft over een hele rij en kolom.":"2 lines at once. Explodes across a whole row and column.","3 lijnen tegelijk. Blaast alles rondom weg.":"3 lines at once. Blasts away everything around it.","Een lijn in één kleur. Wist alle blokken in die kleur.":"A line in one colour. Clears all blocks of that colour.","Kies je spel":"Choose your game","220 levels op 11 kaarten. Je start met 5 oefeningen.":"220 levels on 11 maps. You start with 5 exercises.","Speel zo lang mogelijk en jaag op je record.":"Play as long as you can and chase your record.","Een duel met exact dezelfde blokken als je tegenstander.":"A duel with exactly the same blocks as your opponent.","Vergelijk je score met de wereld en je vrienden.":"Compare your score with the world and your friends."},"fr":{"Campagne":"Campagne","Klassiek":"Classique","Solo spelen tot het bord vol zit. Jaag op je record.":"Jouez let LANG=(()=>{try{const v=localStorage.getItem('blockers-lang');if(v)return v;}catch(e){}
  const n=((navigator.languages&&navigator.languages[0])||navigator.language||'en').slice(0,2).toLowerCase();return ['nl','fr','de'].includes(n)?n:'en';})();
// big numbers with a thousands separator in the style of each language (12.345 / 12 345 / 12,345)
function fmt(n){n=Math.round(+n||0);const sep=LANG==='en'?',':LANG==='fr'?'\u00a0':'.';return (n<0?'-':'')+String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,sep);}
function tx(k,v){let s=(LANG!=='nl'&&I18N[LANG]&&I18N[LANG][k])||k;if(v)s=s.replace(/\{(\w+)\}/g,(m,x)=>v[x]!=null?v[x]:m);return s;}
const dec=x=>LANG==='en'?String(x):String(x).replace('.',',');
function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(e=>{if(!e.dataset.k)e.dataset.k=e.textContent;e.textContent=tx(e.dataset.k);});
  document.querySelectorAll('[data-ta]').forEach(e=>{if(!e.dataset.ka)e.dataset.ka=e.getAttribute('aria-label');e.setAttribute('aria-label',tx(e.dataset.ka));});
  const lb=document.getElementById('lang');if(lb){lb.textContent=LANG.toUpperCase();lb.setAttribute('aria-label',tx('Taal'));}
}
function setLang(l){LANG=l;try{localStorage.setItem('blockers-lang',l)}catch(e){}applyStatic();

function patternOrder(kind,rng){

const trayStuck=st=>!st.tray.some(p=>p&&fitsAnyG(st,p));

      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const R=r+dr,K=c+dc;if(R>=0&&K>=0&&R<N&&K<N&&!st.grid[R][K])cand.push([R,K]);});}

// Two power blocks side by side go off together as one bigger blast (a "power combo").

/* turn engine events into timed animations; returns when the last one ends */
function animateEvents(res,T,cx,cy){
  const times=[],said={};let end=T,krak=false;
  res.events.forEach(ev=>{
    const x=PAD+ev.b*CS,y=PAD+ev.a*CS;let ox,oy,tb;
    if(ev.par<0){[ox,oy]=ev.o?cellXY(ev.a,ev.b):[cx,cy];tb=T+(ev.d||0);}
    else{const pe=res.events[ev.par];[ox,oy]=cellXY(pe.a,pe.b);tb=times[ev.par]+90;}
    const t0=tb+Math.hypot(x+CS/2-ox,y+CS/2-oy)*1.1;times.push(t0);end=Math.max(end,t0+450);
    const cell=ev.cell;
    if(ev.kind==='hit')S.born[ev.a][ev.b]=t0;
    else if(ev.kind==='break'){dying.push({x,y,spr:STONE['1/'+cell.max],t0,stone:true});if(!krak){krak=true;pop(tx('Krak!'),x+CS/2,y,'info','#8f99b0',null,t0);}}
    else if(ev.kind==='unlock'){S.born[ev.a][ev.b]=t0;dying.push({x,y,spr:LOCK,t0,col:'#8f99b0'});}
    else if(ev.kind==='open'){dying.push({x,y,spr:CHEST,t0,col:'#ffc61a'});if(!said.open){said.open=1;pop(tx('Kist open!'),x+CS/2,y,'info','#c9932b',null,t0);at(t0,sfx.make);}}
    else if(ev.kind==='shut'){S.born[ev.a][ev.b]=t0;if(!said.shut){said.shut=1;pop(tx('Sleutel nodig!'),x+CS/2,y,'info','#8f99b0',null,t0);}}
    else{dying.push({x,y,spr:cellSprite(cell),col:cell.moss?'#3fae5f':cell.lava?'#ff6a1a':cell.color,t0});
      if(cell.key&&!said.key){said.key=1;pop(tx('Sleutel!'),x+CS/2,y,'info','#c9932b',null,t0);}
      if(cell.bomb&&!said.bomb){said.bomb=1;pop(tx('Ontmanteld!'),x+CS/2,y,'info','#e07c00',null,t0);}}
    if(ev.ice)dying.push({x,y,spr:ICE,t0:t0+40,col:'#8fd3ff'});
    if(ev.combo){effects.push({type:'combo',r:ev.a,c:ev.b,color:cell.color,color2:ev.mateColor,t0,area:ev.area});
      if(!said.combo){said.combo=1;pop(tx('Power-combo!'),x+CS/2,y-6,'info','#e8559a',22,t0);}
      at(t0,()=>{sfx.combo();buzz([40,30,70]);if(!reduced)shake=Math.max(shake,18);flash=Math.max(flash,.35);});}
    if(ev.sp){if(!ev.combo)effects.push({type:ev.sp,r:ev.a,c:ev.b,color:cell.color,t0,area:ev.area});
      if(ev.lvl>=2)pop(tx('Ketting ×{n}',{n:ev.lvl}),x+CS/2,y+24,'info','#e07c00',null,t0+160);
      const sp=ev.sp;at(t0,()=>{sfx[sp]();buzz(sp==='bom'?50:25);if(!reduced)shake=Math.max(shake,sp==='bom'?14:8);});}
  });
  if(res.hits)at(T+120,res.broken?sfx.smash:sfx.hit);
  if(res.unlocked)at(T+150,sfx.unlock);
  if(res.iceBroken)at(T+90,sfx.ice);
  return end;
}

function crystalFx(cr,t){

// Every step has blocks already on the board, one block to place, an explanation above the board
// and the target cells lit up. The block only fits on the lit cells.
const TC=COLORS; // r o y g b p
const PC=(cells,ci)=>({cells,color:TC[ci],w:Math.max(...cells.map(p=>p[1]))+1,h:Math.max(...cells.map(p=>p[0]))+1});
const H2=[[0,0],[0,1]],V2=[[0,0],[1,0]],V3=[[0,0],[1,0],[2,0]],O2=[[0,0],[0,1],[1,0],[1,1]];
const putB=(r,c,ci,sp)=>{S.grid[r][c]=sp?{color:TC[ci],sp}:{color:TC[ci]};S.born[r][c]=now()+(r+c)*25;};
// fills row r (or column) with blocks, except the given cells
const fillRow=(r,skip,ci)=>{for(let c=0;c<N;c++)if(!skip.includes(c)&&!S.grid[r][c])putB(r,c,ci==null?(c+r)%6:ci);};
const fillCol=(c,skip,ci)=>{for(let r=0;r<N;r++)if(!skip.includes(r)&&!S.grid[r][c])putB(r,c,ci==null?(c+r+2)%6:ci);};
const findSp=sp=>{for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=S.grid[r][c];if(x&&x.sp===sp)return [r,c];}return null;};
// two free cells next to each other in row r that do not touch column avoid
const gapIn=(r,avoid)=>{for(const c of [5,1,4,2,6,0]){if(Math.abs(c-avoid)>0&&Math.abs(c+1-avoid)>0&&c+1<N&&!S.grid[r][c]&&!S.grid[r][c+1])return c;}return avoid>3?0:6;};

function startTraining(k){

  $('tutbox').hidden=false;$('hint').hidden=true;document.querySelector('#s-game .meter').hidden=true;

function tutStepSetup(){
  const L=TRAIN[S.tut.k],st=L.steps[S.tut.step],t=st.setup();

  S.tut.r=t.r;S.tut.c=t.c;S.tut.cells=t.p.cells.map(([a,b])=>[t.r+a,t.c+b]);S.lock=false;
  $('tut-t').textContent=tx('Oefening {n}: {x}',{n:S.tut.k+1,x:tx(L.title)})+' · '+(S.tut.step+1)+'/'+L.steps.length;

function tutAfterMove(wait){
  S.lock=true;const t=S.tut,L=TRAIN[t.k];
  setTimeout(()=>{if(S.mode!=='tut'||S.tut!==t)return;
    t.step++;if(t.step<L.steps.length){tutStepSetup();return;}
    CAMP.tut=Math.max(CAMP.tut||0,t.k+1);saveCampLocal();S.over=true;confetti(80);sfx.cheer(2);
    const last=t.k+1>=TRAIN_N,nodes=[el('h2',null,tx('Oefening {n} gehaald!',{n:t.k+1})),el('p',null,tx(L.goal))];
    if(last)nodes.push(el('div','tipbox',tx('Je kent nu alle basisregels. Kaart 1 van de campagne staat open!')));

/* ================= how the game works: 4 screens at the first start ================= */
function miniBoard(rows,w=220){
  const c=el('canvas'),n=rows[0].length,s=Math.floor(w/n);c.width=n*s*2;c.height=rows.length*s*2;c.style.width=n*s+'px';c.style.height=rows.length*s+'px';
  const g=c.getContext('2d');g.scale(2*s/CS,2*s/CS);
  rows.forEach((row,r)=>[...row].forEach((ch,k)=>{const x=k*CS,y=r*CS;
    g.fillStyle=PAL.cell;rr(g,x+2,y+2,CS-4,CS-4,8);g.fill();
    const i='roygbp'.indexOf(ch);if(i>=0)g.drawImage(SPR[COLORS[i]],x,y,CS,CS);
    if(ch==='*'){g.strokeStyle='#ffb020';g.lineWidth=4;rr(g,x+3,y+3,CS-6,CS-6,9);g.stroke();}
    if(ch==='R')g.drawImage(SPX.raket[COLORS[4]],x,y,CS,CS);if(ch==='B')g.drawImage(SPX.bom[COLORS[0]],x,y,CS,CS);if(ch==='P')g.drawImage(SPX.prisma[COLORS[5]],x,y,CS,CS);}));
  return c;
}

  const emo=e=>el('span','ge',e);

          [()=>spIcon('prisma',5),'Prisma','Een lijn in één kleur. Wist alle blokken in die kleur.']]},
   {t:'Kies je spel',
    list:[[()=>emo('🗺️'),'Campagne','220 levels op 11 kaarten. Je start met 5 oefeningen.'],
          [()=>emo('♾️'),'Klassiek','Speel zo lang mogelijk en jaag op je record.'],
          [()=>emo('⚔️'),'Multiplayer','Een duel met exact dezelfde blokken als je tegenstander.'],
          [()=>emo('🏆'),'Klassement','Vergelijk je score met de wereld en je vrienden.']]}];
  const p=pages[page],dots=el('div','dots');pages.forEach((_,i)=>dots.append(el('span',i===page?'on':null)));

  if(p.x)p.x.forEach(t=>nodes.push(el('p','gtext',tx(t))));

  nodes.push(btn('primary',page<pages.length-1?tx('Volgende'):tx('Spelen'),()=>page<pages.length-1?guide(page+1,onDone):end()));
  if(page<pages.length-1){const sk=el('button','linkbtn',tx('Overslaan'));sk.onclick=end;nodes.push(sk);}

/* ---------- particles ---------- */
function shards(x,y,col,n){if(reduced)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.28,life:1,dec:.022+Math.random()*.02,s:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.4,col,type:'shard'})}}
function sparkle(x,y){if(reduced)return;for(let i=0;i<3;i++)parts.push({x:x+(Math.random()-.5)*CS,y:y+(Math.random()-.5)*CS,vx:0,vy:-.6,g:0,life:1,dec:.03,s:4+Math.random()*5,rot:0,vr:.05,col:'#ffc61a',type:'star'})}
// a clean board: bursts of sparks in all block colours over the board
function fireworks(){if(reduced)return;for(let k=0;k<6;k++)setTimeout(()=>{const x=PAD+40+Math.random()*(BOARD-80),y=PAD+40+Math.random()*(BOARD*.6),col=COLORS[k%6];
  for(let i=0;i<26;i++){const a=i/26*Math.PI*2,v=3+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.06,life:1,dec:.016,s:4,rot:0,vr:0,col,type:'star'});}
  if(k%2===0)sfx.tick();},k*170);}
function confetti(n){if(reduced)return;for(let i=0;i<n;i++)parts.push({x:Math.random()*W,y:-10-Math.random()*60,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,life:1,dec:.006,s:5+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.3,col:COLORS[i%6],type:'conf'})}

/* ---------- ads (AdMob in the Android app, a stand-in in the browser) ---------- */
// The Play Store build switches AD_LIVE on (scripts/android.mjs --release). Test builds
// and the owner's test APKs always use Google's test ads.
const AD_LIVE=false;
const AD_UNITS=AD_LIVE?{reward:'ca-app-pub-8394022188610476/2251067197',inter:'ca-app-pub-8394022188610476/7834566366'}
  :{reward:'ca-app-pub-3940256099942544/5224354917',inter:'ca-app-pub-3940256099942544/1033173712'};
const ADS={plugin:null,privacy:false,busy:false,got:false,closed:null};
const inApp=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
// Starts AdMob and asks Google's EU consent question when needed. A failure never stops the game.
async function initAds(){
  const a=window.Capacitor?.Plugins?.AdMob;if(!a)return;
  try{await a.initialize({initializeForTesting:!AD_LIVE});}catch(e){return;}
  try{let c=await a.requestConsentInfo();
    if(c&&c.isConsentFormAvailable&&c.status==='REQUIRED')c=(await a.showConsentForm())||c;
    ADS.privacy=!!c&&c.privacyOptionsRequirementStatus==='REQUIRED';}catch(e){}
  const gone=()=>{if(ADS.closed)ADS.closed();};
  try{a.addListener('onRewardedVideoAdReward',()=>{ADS.got=true;});
    ['onRewardedVideoAdDismissed','onRewardedVideoAdFailedToShow','interstitialAdDismissed','interstitialAdFailedToShow'].forEach(e=>a.addListener(e,gone));}catch(e){}
  ADS.plugin=a;
}
// Waits until the ad is gone from the screen (closed or failed), at most a minute.
const adGone=()=>new Promise(r=>{ADS.closed=r;setTimeout(r,60000);});
// The browser stand-in: a short countdown instead of a real ad.
function fakeAd(label,done){
  let s=3;const tick=()=>{const box=el('div','adbox');box.append(label,el('br'),tx('Hier komt de AdMob-advertentie'));
    showCard([el('h2',null,tx('Reclame')),box,el('p',null,tx('Nog {n} s',{n:s}))]);
    if(s--<=0){closeCard();done();}else setTimeout(tick,1000);};tick();
}
// A rewarded video. Watched to the end: done(). Closed early: back to the previous card.
// No video available (offline, no ad): the player gets the reward anyway and is never stuck.
// ssv: 'coins' or 'spin' when the server pays the reward; Google then confirms the video to the server
// (server-side verification) with this player's id, so the reward cannot be faked in the app.
async function rewardAd(label,done,ssv){
  if(!inApp())return fakeAd(label,done);
  if(!ADS.plugin){closeCard();return done();}
  if(ADS.busy)return;ADS.busy=true;ADS.got=false;
  const prev=[...card.children];showCard([el('h2',null,tx('Reclame laden…'))]);
  let item=null,failed=false;
  const opts={adId:AD_UNITS.reward,isTesting:!AD_LIVE};if(ssv&&API.s.uid)opts.ssv={userId:API.s.uid,customData:ssv};
  try{const gone=adGone();await ADS.plugin.prepareRewardVideoAd(opts);
    item=await ADS.plugin.showRewardVideoAd();await gone;}catch(e){failed=true;}
  ADS.closed=null;ADS.busy=false;
  if(failed||ADS.got||(item&&item.amount)){closeCard();done();}else showCard(prev);
}
// An interstitial after every 5th game; whatever happens, the game goes on with fn.
async function interAd(fn){
  if(!inApp())return fakeAd(tx('Tussenreclame (na elk 5e spel)'),fn);
  if(!ADS.plugin||ADS.busy)return fn();
  ADS.busy=true;
  try{const gone=adGone();await ADS.plugin.prepareInterstitial({adId:AD_UNITS.inter,isTesting:!AD_LIVE});
    await ADS.plugin.showInterstitial();await gone;}catch(e){}
  ADS.closed=null;ADS.busy=false;fn();
}
function afterGame(fn){games++;if(games%5===0)interAd(fn);else fn();}
function countUp(node,target){const t0=now();(function f(){const a=Math.min(1,(now()-t0)/900);node.textContent=fmt(target*(1-Math.pow(1-a,3)));if(a<1)requestAnimationFrame(f);})();}

function endGame(){
  if(S.over)return;
  finale(async()=>{
    S.shown=S.score;
    S.over=true;
    if(S.mode==='duel')return duelEnd();
    sfx.over();buzz([60,60,120]);renderTools();
    saveScore(S.score);
    const big=el('div','big','0');countUp(big,S.score);
    // coins for this game, paid by the server (a rescued game only pays the extra part)
    const G=S,er=await earnClassic(S.gameId,S.score),coins=er?er.gain:0;
    if(G!==S||screen!=='game')return; // the player left during the server call
    const nodes=[el('h2',null,S.recordHit?tx('Nieuw record!'):tx('Geen plek meer')),big,el('p',null,tx('Je record: {n}',{n:fmt(S.best)}))];
    if(coins>0)nodes.push(el('p','coinline',tx('+{n} munten',{n:coins})+' 🪙'));else if(!er)nodes.push(el('p','coinline',tx('Geen verbinding: geen munten')));
    nodes.push(...endChoices(()=>newBlocks(),()=>{closeCard();afterGame(startClassic);},()=>{closeCard();afterGame(()=>show('menu'));}));
    showCard(nodes); if(S.recordHit)confetti(120);
  });
}
// The 4 choices on every end card (Classic game over, lost level):
//   play on with a heart · play on after a video (once per game) · play again · menu.
// A heart the player does not have, or a video already used in this game, is shown but cannot be tapped.
function endChoices(playOn,again,menu){
  const G=S,n=have('hart');
  const heart=btn('primary','❤️ '+tx('Verder spelen met een hartje')+' ('+n+')',async()=>{
    heart.disabled=true;if(await useItem('hart')&&G===S){closeCard();playOn();}else heart.disabled=!have('hart');});
  heart.disabled=!n;
  const video=btn('primary','▶ '+(S.adUsed?tx('Filmpje al gebruikt in dit spel'):tx('Verder spelen · bekijk reclame')),
    ()=>{if(S.adUsed)return;rewardAd(tx('Beloonde video'),()=>{if(G!==S)return;S.adUsed=true;playOn();});});
  video.disabled=!!S.adUsed;
  return [heart,video,btn('secondary',tx('Opnieuw spelen'),again),btn('secondary',tx('Menu'),menu)];
}
// a fresh set of three blocks that fit the board (rescue in Classic, and the dice helper)
function freshTray(){
  for(let t=0;t<30;t++){const tr=[newPiece(S),newPiece(S),newPiece(S)];if(tr.every(p=>fitsAny(p))){S.tray=tr;S.trayT=now();return true;}}
  return rerollTray(S);
}
function newBlocks(){
  S.over=false;S.lock=false;freshTray();S.trayT=now();hud();renderTools();sfx.make();
  pop(tx('3 nieuwe blokken!'),W/2,PAD+BOARD/2,'callout');
  if(!S.tray.some(x=>x&&fitsAny(x))){S.lock=true;setTimeout(endGame,900);}

const slotX=i=>PAD+BOARD/6*(2*i+1), slotY=TRAY_Y+TRAY_H/2;
function pt(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
function snap(){
  if(!drag)return null;
  const p=S.tray[drag.idx],cx=drag.x,cy=drag.y-LIFT;
  const c=Math.round((cx-p.w*CS/2-PAD)/CS),r=Math.round((cy-p.h*CS/2-PAD)/CS);
  return fits(p,r,c)?{r,c}:null;
}
cv.addEventListener('pointerdown',e=>{
  if(!S||S.over||S.lock||!ov.hidden)return;audio();const q=pt(e);
  // a helper is waiting for a target: a cell for the hammer, a tray block for turning
  if(S.tool){
    if(S.tool==='hamer'&&q.y<TRAY_Y-10){const c=Math.floor((q.x-PAD)/CS),r=Math.floor((q.y-PAD)/CS);if(r>=0&&c>=0&&r<N&&c<N){hammer(r,c);return;}}
    if(S.tool==='raket'&&q.y<TRAY_Y-10){const c=Math.floor((q.x-PAD)/CS),r=Math.floor((q.y-PAD)/CS);if(r>=0&&c>=0&&r<N&&c<N){placeRocket(r,c);return;}}
    if(S.tool==='draai'&&q.y>=TRAY_Y-10){const i=clamp(Math.floor((q.x-PAD)/(BOARD/3)),0,2);if(S.tray[i]){rotatePiece(i);return;}}
    S.tool=null;renderTools();return;}
  if(q.y<TRAY_Y-10)return;
  const i=clamp(Math.floor((q.x-PAD)/(BOARD/3)),0,2);if(!S.tray[i])return;
  drag={idx:i,x:q.x,y:q.y,t0:now()};cv.setPointerCapture(e.pointerId);sfx.pick();

    closeCard();renderMenu();if(done)done(true);});
  inp.onkeydown=e=>{if(e.key==='Enter')go.click();};

  if(cancelable)nodes.push(btn('secondary',tx('Annuleren'),()=>{closeCard();if(done)done(false);}));

    turn.forEach(d=>l.append(drow(tx('{x} daagt je uit',{x:nickOf(d.from)}),d.mode==='random'?tx('Willekeurig duel'):tx('Vriendenduel'),btn('mini go',tx('Speel'),()=>playDuel(d)))));nodes.push(l);}
  nodes.push(el('h2','sec',tx('Daag een vriend uit')));
  const fr=NET.player?.friends||[];
  if(!fr.length)nodes.push(el('div','empty',tx('Nog geen vrienden. Voeg ze toe met hun vriendcode in Klassement › Vrienden.')));
  else{loadNicks(fr);const l=el('div','list');fr.forEach(id=>l.append(drow(nickOf(id),'',btn('mini go',tx('Uitdagen'),()=>challenge(id)))));nodes.push(l);}
  const rest=NET.duels.filter(d=>!myTurn(d)).slice(0,15);
  if(rest.length){nodes.push(el('h2','sec',tx('Recente duels')));const l=el('div','list');
    rest.forEach(d=>{const o=oppOf(d),mine=myRes(d),theirs=o&&d.r&&d.r[o];let t,cls='';
      if(!mine){t=tx('Nog niet gespeeld');}
      else if(!o){t=tx('Zoekt tegenstander · jij {n}',{n:fmt(mine.score)});}
      else if(!theirs){t=tx('Wacht op {x} · jij {n}',{x:nickOf(o),n:fmt(mine.score)});}
      else{const w=mine.score>theirs.score?'w':mine.score<theirs.score?'l':'d';cls='res-'+w;t=(w==='w'?tx('Gewonnen'):w==='l'?tx('Verloren'):tx('Gelijk'))+' '+fmt(mine.score)+' – '+fmt(theirs.score);}
      const s=el('small',cls,t);

      l.append(drow(o?tx('tegen {x}',{x:nickOf(o)}):tx('Willekeurig duel'),s,act));});

function drow(title,sub,action){const r=el('div','drow'),t=el('div','t');t.append(el('b',null,title));
  if(sub)t.append(typeof sub==='string'?el('small',null,sub):sub);r.append(t);if(action)r.append(action);return r;}
async function findRandom(){
  if(!(await ensureNick()))return;
  showCard([el('h2',null,tx('Tegenstander zoeken…')),el('p',null,tx('Even geduld.'))]);
  try{
    // The server pairs us with the oldest open duel someone already played, or opens a new one.
    const d=toDuel(await API.call('gq_duel_random'));
    NET.duels=[d,...NET.duels.filter(x=>x.id!==d.id)];
    closeCard();playDuel(d);
  }catch(e){showCard([el('h2',null,tx('Zoeken lukte niet')),el('p',null,tx('Controleer je verbinding en probeer opnieuw.')),btn('primary','OK',closeCard)]);}
}
async function challenge(fid){
  if(!(await ensureNick()))return;
  try{
    const x=await API.call('gq_duel_challenge',{p_friend:fid});
    if(!x||!x.id)throw new Error(x&&x.status||'refused');
    const d=toDuel(x);NET.duels=[d,...NET.duels];playDuel(d);
  }catch(e){toast(tx('Uitdagen lukte niet.'));}
}
function playDuel(d){
  if(myRes(d))return;
  const o=oppOf(d),g=o&&d.r&&d.r[o];
  audio();
  newGame({mode:'duel',seed:d.seed,duel:{id:d.id,opp:o,oppName:o?nickOf(o):'',ghost:g?g.prog:null,oppScore:g?g.score:null}});
  hud();
}
function duelUpdate(d){
  const o=oppOf(d),g=o&&d.r&&d.r[o];
  S.duel.opp=o;S.duel.oppName=o?nickOf(o):'';
  if(g){S.duel.ghost=g.prog;S.duel.oppScore=g.score;}
  if(S.over&&!ov.hidden&&card.dataset.duel===d.id)duelCard();else if(!S.over)hud();
}
function duelEnd(){
  sfx.over();
  if(online()&&S.duel.id){const id=S.duel.id,score=S.score,prog=S.prog.slice(0,DUEL_MOVES).map(x=>Math.round(x));
    write(()=>API.call('gq_duel_submit',{p_duel:id,p_score:score,p_prog:prog}).then(()=>refreshDuels()));}

}
function duelCard(){
  const d=S.duel,op=d.oppScore,nodes=[];
  let title=tx('Score ingediend');
  if(op!=null){title=S.score>op?tx('Gewonnen!'):S.score<op?tx('Verloren'):tx('Gelijkspel');}
  nodes.push(el('h2',null,title));

  showCard(nodes);card.dataset.duel=d.id;
}

let lbTab='world', lbReq=0;
['world','week','friends'].forEach(t=>$('t-'+t).onclick=()=>{lbTab=t;openLB(t);});
function closeLB(){lbReq++;}
async function openLB(tab){
  closeLB();const req=lbReq;['world','week','friends'].forEach(t=>$('t-'+t).setAttribute('aria-selected',t===tab));
  const box=$('lb-body');
  if(!online())return offlineNote(box);
  box.replaceChildren(el('div','empty',tx('Laden…')));
  try{
    if(tab==='friends')await refreshFriends();
    const r=await API.call('gq_leaderboard',{p_scope:tab,p_limit:50});
    if(req!==lbReq)return;
    const idOf=n=>(NET.friends.find(f=>f.nickname===n)||{}).id||null;
    const rows=(r.top||[]).map(x=>({uid:x.me?NET.me:idOf(x.nickname),nick:x.nickname,score:x.score,rank:x.rank,friend:!!x.friend}));
    if(r.me&&!rows.some(x=>x.uid===NET.me))rows.push({uid:NET.me,nick:r.me.nickname,score:r.me.score,rank:r.me.rank});
    renderLB(tab,rows);
  }catch(e){if(req===lbReq)box.replaceChildren(el('div','empty',tab==='friends'?tx('Je vrienden konden niet laden.'):tx('Het klassement kon niet laden.')));}

const PLAY_ID='be.proqltc.gridquake';
const playLink=code=>'https://play.google.com/store/apps/details?id='+PLAY_ID+'&referrer='+encodeURIComponent('utm_source=invite&code='+code);

// Opens the phone's own share screen, so the player picks WhatsApp, mail, SMS…
// In the app this is the Capacitor Share plugin, in a phone browser the Web Share API.
// A desktop browser without a share screen copies the invitation instead.
async function shareInvite(code,b){
  const msg=inviteText(code),S=window.Capacitor?.Plugins?.Share;
  try{
    if(inApp()&&S){await S.share({title:'Gridquake',text:msg,dialogTitle:tx('Nodig een vriend uit')});return;}
    if(navigator.share){await navigator.share({title:'Gridquake',text:msg});return;}
  }catch(e){return;} // the player closed the share screen
  try{await navigator.clipboard.writeText(msg);const t=b.textContent;b.textContent=tx('Gekopieerd ✓');setTimeout(()=>{b.textContent=t;},2000);}catch(e){}
}
function renderLB(tab,rows){
  const box=$('lb-body'),nodes=[];
  if(tab==='week')nodes.push(el('p','muted',tx('Week {n}. Begint elke maandag opnieuw.',{n:weekKey().split('-W')[1]})));
  if(!NET.player)nodes.push(el('p','muted',tx('Kies onderaan in het menu een gebruikersnaam om in het klassement te staan.')));
  if(!rows.length)nodes.push(el('div','empty',tab==='friends'?tx('Voeg vrienden toe met hun code hieronder.'):tx('Nog geen scores. Speel Klassiek en zet de eerste!')));
  const l=el('div','list');
  rows.forEach(p=>{
    const r=el('div','row'+(p.uid===NET.me?' you':'')),k=p.rank;
    const fm=p.uid===NET.me?medalCount():((NET.friends.find(f=>f.id===p.uid)||{}).medals||0);
    r.append(el('span','rank'+(k<=3?' g'+k:''),String(k)),el('span','nm',(p.uid===NET.me?p.nick+' ('+tx('jij')+')':p.nick)+(tab==='friends'&&fm?' · 🏅 '+fm:'')),el('span','pts',fmt(p.score||0)));
    if(tab==='friends'&&p.uid&&p.uid!==NET.me)r.append(btn('mini',tx('Uitdagen'),()=>challenge(p.uid)));
    else r.append(el('span',p.friend?'muted':null,p.friend?tx('vriend'):''));
    l.append(r);});
  nodes.push(l);
  if(NET.player&&tab==='friends'){
    nodes.push(el('h2','sec',tx('Vrienden')));
    const cb=el('div','codebox');cb.append(el('span','muted',tx('Jouw vriendcode')),el('span','code',NET.player.code||'–'));nodes.push(cb);
    const inv=btn('primary','📨 '+tx('Nodig een vriend uit'),()=>shareInvite(NET.player.code||'',inv));nodes.push(inv);
    const add=el('div','codebox'),inp=el('input');inp.type='text';inp.id='fcode';inp.maxLength=6;inp.placeholder=tx('Code van je vriend');inp.setAttribute('aria-label',tx('Vriendcode'));
    const go=btn('mini go',tx('Toevoegen'),async()=>{
      const c=inp.value.trim().toUpperCase();if(c.length!==6)return;
      try{const r=await API.call('gq_add_friend',{p_code:c});
        if(r.status==='unknown'||r.status==='self'){inp.value='';inp.placeholder=tx('Code niet gevonden');return;}
        if(r.status!=='added'&&r.status!=='already'){inp.value='';inp.placeholder=tx('Probeer opnieuw');return;}
        inp.value='';openLB('friends');
      }catch(e){inp.placeholder=tx('Probeer opnieuw');}});
    add.append(inp,go);nodes.push(add);
  }
  box.replaceChildren(...nodes);
}

async function restoreFlow(raw,msg){
  const c=normCode(raw);msg.classList.add('err');
  if(c.length!==12){msg.textContent=tx('Code niet gevonden');return;}
  if(!online()){msg.textContent=tx('Herstelcode niet beschikbaar.');return;}
  const pretty=c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8);
  showCard([el('h2',null,tx('Account herstellen?')),el('p',null,tx('De gegevens op dit toestel worden vervangen door die van {x}.',{x:pretty})),
    btn('primary',tx('Herstellen'),async()=>{
      const fail=t=>showCard([el('h2',null,tx('Account herstellen?')),el('p','note err',t),btn('secondary',tx('Sluiten'),settingsCard)]);
      try{
        const r=await API.call('gq_restore',{p_code:c});
        if(r.status==='unknown')return fail(tx('Code niet gevonden'));
        if(r.status==='self')return fail(tx('Dit is je huidige account.'));
        if(r.status!=='restored')return fail(tx('Probeer opnieuw'));
        setProfile(r.profile);
        CAMP={s:{...(NET.player?.camp||{})},b:{},st:{},md:{...((r.profile&&r.profile.medals)||{})}};saveCampLocal();store.set('blockers-best',NET.player?.best||0);
        store.set('blockers-wk-'+weekKey(),NET.player?.weekBest||0);
        await refreshFriends();await refreshDuels();
        renderMenu();showCard([el('h2',null,tx('Account hersteld')),el('p',null,NET.player?.nick||''),btn('primary',tx('Sluiten'),closeCard)]);
      }catch(e){console.warn(e);fail(tx('Probeer opnieuw'));}
    }),
    btn('secondary',tx('Annuleren'),settingsCard)]);
}
function deleteFlow(){
  showCard([el('h2',null,tx('Alles verwijderen?')),el('p',null,tx('Je gebruikersnaam, scores, sterren en vrienden worden definitief gewist. Dit kan niet ongedaan worden.')),
    btn('danger solid',tx('Verwijderen'),async()=>{
      if(online()){try{await API.call('gq_delete_me');}catch(e){console.warn(e);}}
      try{Object.keys(localStorage).filter(k=>k.startsWith('blockers-')).forEach(k=>localStorage.removeItem(k));}catch(e){}
      location.reload();}),
    btn('secondary',tx('Annuleren'),settingsCard)]);
}

    store.set('blockers-guide','1');store.set('blockers-lang',LANG);langChosen=true;
    initAds();campMap='tut';startTraining(0);return;}
  if(!langChosen&&!store.get('blockers-lang')){showCard([el('h2',null,tx('Kies je taal')),langRow(()=>{langChosen=true;closeCard();onboarding();})]);return;}
  await Promise.race([NET.ready,new Promise(r=>setTimeout(r,8000))]);

  const next=()=>{if(store.get('blockers-guide')!=='1')guide(0,initAds);else initAds();};

}
